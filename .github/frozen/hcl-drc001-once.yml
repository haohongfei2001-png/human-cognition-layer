name: HCL DRC001 One-Time Strong Base vs Current HCL Development Reality Check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unique first main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hcl-drc001-once.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/drc001-runs.json
          python - <<'PY'
          import json,os
          runs=json.load(open('/tmp/drc001-runs.json'))['workflow_runs']
          assert len(runs)==1 and str(runs[0]['id'])==os.environ['GITHUB_RUN_ID']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==2.14.0'
      - name: Frozen provider-free entry and scoring checks
        run: python -m unittest tests.test_development_reality_check
      - name: One frozen development check with publisher/history gates before transport
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HCL_DRC001_AUTHORIZED: ONE_DEVELOPMENT_REALITY_CHECK_ONLY
        run: python -m scripts.development_reality_check --execute --history --publisher --output drc001-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-drc001-${{ github.run_id }}
          path: |
            drc001-receipt.json
            drc001-preflight.json
            drc001-history-audit.json
            reports/HCL_DRC001_PACKAGE.json
            reports/HCL_DRC001_SUBSET.json
