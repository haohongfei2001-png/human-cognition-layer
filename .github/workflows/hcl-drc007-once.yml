name: HCL DRC007 One Concrete-Fresh Development Batch
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hcl-drc007-single-writer
  cancel-in-progress: false
jobs:
  development-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unique first main invocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hcl-drc007-once.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/drc007-runs.json
          python - <<'PY'
          import json,os
          runs=json.load(open('/tmp/drc007-runs.json'))['workflow_runs']
          assert len(runs)==1 and str(runs[0]['id'])==os.environ['GITHUB_RUN_ID']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==2.14.0' 'pydantic==2.13.5'
      - name: Frozen no-provider correctness and runtime
        run: |
          python -m unittest tests.test_development_reality_batch007 tests.test_v1_adaptive_reader_entry tests.test_provider_json_contract
          python -m scripts.development_runtime_amendment_v23
      - name: New independent bounded grant, zero retries, no consumed rerun
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HCL_DRC007_AUTHORIZED: ONE_FRESH_DEVELOPMENT_BATCH_ONLY
        run: python -m scripts.development_reality_batch007 --execute --history --publisher --output drc007-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-drc007-${{ github.run_id }}
          path: |
            drc007-receipt.json
            drc007-preflight.json
            drc007-source-preflight.json
            reports/HCL_DRC007_PACKAGE.json
