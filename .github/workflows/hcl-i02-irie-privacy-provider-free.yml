name: HCL I02 Certified Replay and Reader Entry
on:
  pull_request:
    paths: ['scripts/i02*', 'scripts/run_i02*', 'scripts/serious_eval*', 'tests/test_i02*', 'reports/HCL_I02*', '.github/workflows/hcl-i02-irie-privacy*', 'hcl/**']
  push:
    branches: [main]
    paths: ['scripts/i02*', 'scripts/run_i02*', 'scripts/serious_eval*', 'tests/test_i02*', 'reports/HCL_I02*', '.github/workflows/hcl-i02-irie-privacy*', 'hcl/**']
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Current source carry, negative inference and option boundary
        run: python -m unittest tests.test_v1_reader_source_carry tests.test_v1_i01_eval_contract tests.test_i02_exposure_history tests.test_v1_reader_argument_question tests.test_i02_shea_development_case tests.test_i02_rebus_kranak_exposure
      - name: Current disclosed runtime
        run: python -m scripts.development_runtime_amendment_v15
      - name: Consumed privacy package replay at certified v5 runtime
        run: python -m scripts.i02_replay_irie_privacy_freeze
