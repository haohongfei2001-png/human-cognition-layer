name: HCL approved two-stage provider-free preparation
on:
  pull_request:
    paths: ['.github/HCL_SEMANTIC_SMOKE_20261007_*', '.github/workflows/hcl-semantic-smoke-20261007-*.yml', 'reports/HCL_SEMANTIC_SMOKE_20261007*', '.github/frozen/hcl-semantic-smoke-20261007/**', 'docs/HCL_SEMANTIC_SMOKE_20261007.md', '.github/HCL_PLANNING_RECOVERY_20261007_*', '.github/workflows/hcl-planning-recovery-20261007-*.yml', 'reports/HCL_PLANNING_RECOVERY_20261007*', '.github/frozen/hcl-planning-recovery-20261007/**', 'docs/HCL_PLANNING_RECOVERY_20261007.md', '.github/HCL_RELIABILITY_20261007_*', '.github/workflows/hcl-reliability-20261007-*.yml', 'reports/HCL_RELIABILITY_20261007*', '.github/frozen/hcl-reliability-20261007/**', 'docs/HCL_RELIABILITY_20261007.md', 'scripts/development_planner_lifecycle_amendment.py', 'scripts/development_semantic_bridge_contract_amendment.py', 'scripts/development_planning_recovery_history.py', 'reports/HCL_SEMANTIC_BRIDGE_CONTRACT*', 'docs/HCL_SEMANTIC_BRIDGE_CONTRACT.md', 'scripts/development_planning_allowance_amendment.py', 'scripts/development_reliability_history.py', 'reports/HCL_ORDINARY_PLANNING_ALLOWANCE*', 'docs/HCL_ORDINARY_PLANNING_ALLOWANCE.md', 'reports/HCL_PLANNER_LIFECYCLE_CONTRACT*', 'docs/HCL_PLANNER_LIFECYCLE_CONTRACT.md', 'scripts/development_plan_pursuit_amendment.py', 'reports/HCL_PLAN_PURSUIT_UNCERTAINTY*', 'docs/HCL_PLAN_PURSUIT_UNCERTAINTY.md', 'scripts/development_native_reader_policy_amendment.py', 'reports/HCL_NATIVE_READER_POLICY*', 'docs/HCL_NATIVE_READER_POLICY.md', 'scripts/development_universal_source_amendment.py', 'reports/HCL_UNIVERSAL_SOURCE_SNAPSHOT*', 'docs/HCL_UNIVERSAL_SOURCE_SNAPSHOT.md', 'scripts/*two_stage*.py', 'tests/test_two_stage*.py', '.github/frozen/hcl-two-stage-20261006/**', '.github/workflows/hcl-two-stage-*.yml', '.github/HCL_TWO_STAGE_*', 'reports/HCL_TWO_STAGE_*', 'docs/HCL_TWO_STAGE_20261006.md']
  push:
    branches: [main]
    paths: ['.github/HCL_SEMANTIC_SMOKE_20261007_*', '.github/workflows/hcl-semantic-smoke-20261007-*.yml', 'reports/HCL_SEMANTIC_SMOKE_20261007*', '.github/frozen/hcl-semantic-smoke-20261007/**', 'docs/HCL_SEMANTIC_SMOKE_20261007.md', '.github/HCL_PLANNING_RECOVERY_20261007_*', '.github/workflows/hcl-planning-recovery-20261007-*.yml', 'reports/HCL_PLANNING_RECOVERY_20261007*', '.github/frozen/hcl-planning-recovery-20261007/**', 'docs/HCL_PLANNING_RECOVERY_20261007.md', '.github/HCL_RELIABILITY_20261007_*', '.github/workflows/hcl-reliability-20261007-*.yml', 'reports/HCL_RELIABILITY_20261007*', '.github/frozen/hcl-reliability-20261007/**', 'docs/HCL_RELIABILITY_20261007.md', 'scripts/development_planner_lifecycle_amendment.py', 'scripts/development_semantic_bridge_contract_amendment.py', 'scripts/development_planning_recovery_history.py', 'reports/HCL_SEMANTIC_BRIDGE_CONTRACT*', 'docs/HCL_SEMANTIC_BRIDGE_CONTRACT.md', 'scripts/development_planning_allowance_amendment.py', 'scripts/development_reliability_history.py', 'reports/HCL_ORDINARY_PLANNING_ALLOWANCE*', 'docs/HCL_ORDINARY_PLANNING_ALLOWANCE.md', 'reports/HCL_PLANNER_LIFECYCLE_CONTRACT*', 'docs/HCL_PLANNER_LIFECYCLE_CONTRACT.md', 'scripts/development_plan_pursuit_amendment.py', 'reports/HCL_PLAN_PURSUIT_UNCERTAINTY*', 'docs/HCL_PLAN_PURSUIT_UNCERTAINTY.md', 'scripts/development_native_reader_policy_amendment.py', 'reports/HCL_NATIVE_READER_POLICY*', 'docs/HCL_NATIVE_READER_POLICY.md', 'scripts/development_universal_source_amendment.py', 'reports/HCL_UNIVERSAL_SOURCE_SNAPSHOT*', 'docs/HCL_UNIVERSAL_SOURCE_SNAPSHOT.md', 'scripts/*two_stage*.py', 'tests/test_two_stage*.py', '.github/frozen/hcl-two-stage-20261006/**', '.github/workflows/hcl-two-stage-*.yml', 'reports/HCL_TWO_STAGE_*', 'docs/HCL_TWO_STAGE_20261006.md']
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==2.14.0' 'z3-solver==4.15.4.0' 'pandas>=2.2,<3' 'cryptography==50.0.0'
      - run: python -m scripts.development_final_context_history
      - run: python -m scripts.development_semantic_bridge_contract_amendment
      - run: python -m unittest discover -s tests -p 'test_v1*.py'
      - run: python -m scripts.development_explicit_citation_history
      - run: python -m scripts.development_final_delivery_history
      - name: Consumed 4K reliability guards at exact closed historical runtime, provider-free
        run: python -m scripts.development_reliability_history
      - name: Consumed 16K recovery executor at exact closed historical runtime, provider-free
        run: python -m scripts.development_planning_recovery_history
      - name: New single semantic smoke package, provider-free only
        env:
          PYTHONPATH: .github/frozen/hcl-semantic-smoke-20261007/executor:.
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import hcl_semantic_smoke_candidate as smoke
          folder = Path('.github/frozen/hcl-semantic-smoke-20261007')
          package = smoke.FrozenPackage(json.loads((folder / 'package.json').read_text()), json.loads((folder / 'cases.json').read_text()), Path('.').resolve())
          package.verify()
          assert package.value['configuration']['stage_orders'] == {'1': [[package.cases[0]['case_id'], 'HCL']]}
          assert smoke.MAX_CALLS == {1: 2} and smoke.TOTAL_CNY == 2
          for path in sorted(Path('.github').glob('HCL_SEMANTIC_SMOKE_20261007_*_GRANT.json')):
              grant = json.loads(path.read_text())
              if grant['status'] == 'READY':
                  smoke.require_new_grant(package, grant, grant['stage'], smoke.timestamp(grant['approved_at_bound']))
              elif grant['status'] == 'CLOSED_NO_TRANSFER_NO_RETRY':
                  assert grant['remaining_authorized_calls'] == 0 and grant['remaining_authorized_cny'] == '0'
              else:
                  raise SystemExit('UNRECOGNIZED_SINGLE_SMOKE_AUTHORITY_STATE')
          assert not Path('.github/HCL_SEMANTIC_SMOKE_20261007_2_GRANT.json').exists()
          assert not Path('.github/HCL_SEMANTIC_SMOKE_20261007_2_TRIGGER.json').exists()
          PYCODE
          python -m unittest discover -s .github/frozen/hcl-semantic-smoke-20261007/executor/tests -v
