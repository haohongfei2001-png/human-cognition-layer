name: HCL approved two-stage provider-free preparation
on:
  pull_request:
    paths: ['scripts/development_native_reader_policy_amendment.py', 'reports/HCL_NATIVE_READER_POLICY*', 'docs/HCL_NATIVE_READER_POLICY.md', 'scripts/development_universal_source_amendment.py', 'reports/HCL_UNIVERSAL_SOURCE_SNAPSHOT*', 'docs/HCL_UNIVERSAL_SOURCE_SNAPSHOT.md', 'scripts/*two_stage*.py', 'tests/test_two_stage*.py', '.github/frozen/hcl-two-stage-20261006/**', '.github/workflows/hcl-two-stage-*.yml', '.github/HCL_TWO_STAGE_*', 'reports/HCL_TWO_STAGE_*', 'docs/HCL_TWO_STAGE_20261006.md']
  push:
    branches: [main]
    paths: ['scripts/development_native_reader_policy_amendment.py', 'reports/HCL_NATIVE_READER_POLICY*', 'docs/HCL_NATIVE_READER_POLICY.md', 'scripts/development_universal_source_amendment.py', 'reports/HCL_UNIVERSAL_SOURCE_SNAPSHOT*', 'docs/HCL_UNIVERSAL_SOURCE_SNAPSHOT.md', 'scripts/*two_stage*.py', 'tests/test_two_stage*.py', '.github/frozen/hcl-two-stage-20261006/**', '.github/workflows/hcl-two-stage-*.yml', 'reports/HCL_TWO_STAGE_*', 'docs/HCL_TWO_STAGE_20261006.md']
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==2.14.0' 'z3-solver==4.15.4.0' 'pandas>=2.2,<3' 'cryptography==50.0.0'
      - run: python -m scripts.development_final_context_history
      - run: python -m scripts.development_native_reader_policy_amendment
      - run: python -m unittest discover -s tests -p 'test_v1*.py'
      - run: python -m scripts.development_explicit_citation_history
      - run: python -m scripts.development_final_delivery_history
