permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==2.14.0' 'z3-solver==4.15.4.0' 'pandas>=2.2,<3' 'cryptography==50.0.0'
      - run: python -m scripts.development_final_context_history
      - run: python -m scripts.development_input_phase_contract_amendment
      - run: python -m unittest discover -s tests -p 'test_v1*.py'
      - run: python -m scripts.development_explicit_citation_history
      - run: python -m scripts.development_final_delivery_history
      - name: Consumed 4K reliability guards at exact closed historical runtime, provider-free
        run: python -m scripts.development_reliability_history
      - name: Consumed 16K recovery executor at exact closed historical runtime, provider-free
        run: python -m scripts.development_planning_recovery_history
      - name: Consumed single semantic smoke at exact closed historical runtime, provider-free
        run: python -m scripts.development_semantic_smoke_history
      - name: Consumed entry-validation executor and request identity at exact closed runtime, provider-free
        run: python -m scripts.development_entry_validation_history
      - name: Frozen input-phase smoke and actual independent reviews, provider-free
        env:
          PYTHONPATH: .github/frozen/hcl-input-phase-smoke-20261007/executor:.
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from hcl_input_phase_smoke_candidate import FrozenPackage
          root = Path.cwd()
          frozen = root / '.github/frozen/hcl-input-phase-smoke-20261007'
          package = FrozenPackage(json.loads((frozen / 'package.json').read_text()), json.loads((frozen / 'cases.json').read_text()), root)
          package.verify()
          print('INPUT_PHASE_SMOKE_FROZEN_PACKAGE_VERIFIED_NO_PROVIDER_CALL')
          PYCODE
      - name: Single-smoke pre-final native, disclosure and budget regressions, provider-free
        env:
          PYTHONPATH: .github/frozen/hcl-input-phase-smoke-20261007/executor:.
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s .github/frozen/hcl-input-phase-smoke-20261007/executor/tests -v
