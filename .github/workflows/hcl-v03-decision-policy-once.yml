name: HCL v0.3 Decision Policy Synthetic

on:
  push:
    branches:
      - main
    paths:
      - ".github/HCL_DECISION_POLICY_TRIGGER"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai

      - name: Run synthetic decision-policy suite
        shell: bash
        run: python scripts/run_hcl_v03_decision_policy.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcl-decision-policy-${{ github.run_id }}
          path: artifacts/decision-policy-v01/
          if-no-files-found: warn
          retention-days: 30
