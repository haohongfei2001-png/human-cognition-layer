name: HCL v0.5 Current Stance Core

on:
  pull_request:
    paths:
      - "hcl/v05/**"
      - "tests/test_v05_*.py"
      - "docs/HCL_V05_*.md"
      - ".github/workflows/hcl-v05-current-stance.yml"
  push:
    branches:
      - main
    paths:
      - "hcl/v05/**"
      - "tests/test_v05_*.py"
      - "docs/HCL_V05_*.md"
      - ".github/workflows/hcl-v05-current-stance.yml"

permissions:
  contents: read

jobs:
  current-stance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile v0.5
        run: python -m compileall -q hcl/v05 tests/test_v05_*.py
      - name: Run provider-free state-machine tests
        run: python -m unittest -v tests.test_v05_current_stance
