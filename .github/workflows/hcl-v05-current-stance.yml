name: HCL v0.5 Current Stance Core

on:
  pull_request:
    paths:
      - "hcl/v05/**"
      - "tests/test_v05_*.py"
      - "docs/HCL_V05_*.md"
      - "eval/v05/**"
      - "scripts/run_v05_semantic_extraction_v01.py"
      - "scripts/run_v05_strong_baseline_replication_v01.py"
      - ".github/workflows/hcl-v05-current-stance.yml"
      - ".github/workflows/hcl-v05-seeded-state-capability-v01-once.yml"
      - ".github/workflows/hcl-v05-routed-semantic-extraction-v02-once.yml"
      - ".github/workflows/hcl-v05-semantic-extraction-v01-once.yml"
  push:
    branches:
      - main
    paths:
      - "hcl/v05/**"
      - "tests/test_v05_*.py"
      - "docs/HCL_V05_*.md"
      - "eval/v05/**"
      - "scripts/run_v05_semantic_extraction_v01.py"
      - "scripts/run_v05_strong_baseline_replication_v01.py"
      - ".github/workflows/hcl-v05-current-stance.yml"
      - ".github/workflows/hcl-v05-seeded-state-capability-v01-once.yml"
      - ".github/workflows/hcl-v05-routed-semantic-extraction-v02-once.yml"
      - ".github/workflows/hcl-v05-semantic-extraction-v01-once.yml"

permissions:
  contents: read

jobs:
  current-stance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile v0.5
        run: python -m compileall -q hcl/v05 tests/test_v05_*.py
      - name: Run provider-free v0.5 tests
        run: |
          python -m unittest -v \
            tests.test_v05_current_stance \
            tests.test_v05_semantic_runtime \
            tests.test_v05_store \
            tests.test_v05_semantic_extraction_runner \
            tests.test_v05_routed_semantic \
            tests.test_v05_seeded_state_capability_runner \
            tests.test_v05_routed_extraction_runner_v02 \
            tests.test_v05_strong_baseline_replication_runner
      - name: Run semantic extraction provider-free preflight when present
        if: ${{ hashFiles('scripts/run_v05_semantic_extraction_v01.py') != '' }}
        run: python scripts/run_v05_semantic_extraction_v01.py --validate-only
      - name: Run seeded state capability provider-free preflight when present
        if: ${{ hashFiles('scripts/run_v05_seeded_state_capability_v01.py') != '' }}
        run: python scripts/run_v05_seeded_state_capability_v01.py --validate-only
      - name: Run strong-baseline replication provider-free preflight when present
        if: ${{ hashFiles('scripts/run_v05_strong_baseline_replication_v01.py') != '' }}
        run: python scripts/run_v05_strong_baseline_replication_v01.py --validate-only
      - name: Run routed extraction v0.2 provider-free preflight when present
        if: ${{ hashFiles('scripts/run_v05_routed_semantic_extraction_v02.py') != '' }}
        run: python scripts/run_v05_routed_semantic_extraction_v02.py --validate-only
