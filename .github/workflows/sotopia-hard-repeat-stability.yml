name: SOTOPIA-Hard Repeat Stability

on:
  push:
    branches:
      - main
    paths:
      - ".github/SOTOPIA_HARD_REPEAT_STABILITY_TRIGGER"

permissions:
  contents: read

jobs:
  paired-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [43, 44]
        start: [10, 12, 14, 16, 18]

    env:
      CUSTOM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SOTOPIA_STORAGE_BACKEND: redis
      REDIS_OM_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned SOTOPIA
        shell: bash
        run: |
          git clone --quiet https://github.com/sotopia-lab/sotopia.git .cache/sotopia
          git -C .cache/sotopia checkout --quiet --detach a0aaafb440e570e5e61b7c44a44e5e417c545383
          python -m pip install --upgrade pip
          python -m pip install -e .cache/sotopia
          python -m pip install \
            "pydantic==2.9.2" \
            "redis-om==0.3.2" \
            "redis==5.1.1" \
            "openai==2.14.0" \
            "litellm==1.80.11"

      - name: Load official SOTOPIA dataset into Redis
        shell: bash
        run: |
          mkdir -p .cache/redis-data
          curl -L --fail --retry 3 \
            "https://huggingface.co/datasets/cmu-lti/sotopia-pi/resolve/main/dump.rdb?download=true" \
            -o .cache/redis-data/dump.rdb
          test -s .cache/redis-data/dump.rdb
          docker run -d \
            --name hcl-sotopia-redis \
            -p 6379:6379 \
            -v "$PWD/.cache/redis-data:/data" \
            redis/redis-stack-server:latest
          for i in {1..30}; do
            if docker exec hcl-sotopia-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker logs hcl-sotopia-redis
          exit 1

      - name: Verify hard benchmark data exists
        shell: bash
        run: |
          python - <<'PY'
          from sotopia.database.persistent_profile import EnvironmentList
          hard = EnvironmentList.get("01HAK34YPB1H1RWXQDASDKHSNS")
          assert len(hard.environments) >= 20
          assert len(hard.agent_index or []) >= 20
          print("hard_env_count", len(hard.environments))
          PY

      - name: Run repeat shard
        shell: bash
        run: |
          python scripts/run_sotopia_hard_slice_ab.py \
            --start ${{ matrix.start }} \
            --count 2 \
            --seed ${{ matrix.seed }}

      - name: Upload repeat shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sotopia-hard-repeat-seed-${{ matrix.seed }}-start-${{ matrix.start }}-${{ github.run_id }}
          path: artifacts/sotopia-hard-slice-ab/
          if-no-files-found: warn
          retention-days: 30

      - name: Redis logs on failure
        if: failure()
        shell: bash
        run: docker logs hcl-sotopia-redis || true

  aggregate-repeat:
    needs: paired-repeat
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [43, 44]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sotopia-hard-repeat-seed-${{ matrix.seed }}-start-*-${{ github.run_id }}
          path: downloaded-repeat
          merge-multiple: false

      - name: Aggregate repeat
        shell: bash
        run: |
          python scripts/aggregate_sotopia_slice_artifacts.py \
            --root downloaded-repeat \
            --out artifacts/sotopia-hard-repeat-summary \
            --expected-start 10 \
            --expected-count 10

      - name: Upload repeat summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sotopia-hard-repeat-summary-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/sotopia-hard-repeat-summary/
          if-no-files-found: warn
          retention-days: 30
