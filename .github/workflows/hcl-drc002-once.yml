name: HCL DRC002 One-Time Narrative and Philosophy Development Reality Check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unique first main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hcl-drc002-once.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/drc002-runs.json
          python - <<'PY'
          import json,os
          runs=json.load(open('/tmp/drc002-runs.json'))['workflow_runs']
          assert len(runs)==1 and str(runs[0]['id'])==os.environ['GITHUB_RUN_ID']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==2.14.0' 'pyarrow==20.0.0'
      - name: Frozen provider-free native inputs and scoring checks
        run: python -m unittest tests.test_development_reality_batch
      - name: One frozen development check; publisher/history before transport
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HCL_DRC002_AUTHORIZED: ONE_DEVELOPMENT_REALITY_CHECK_ONLY
        run: python -m scripts.development_reality_batch --execute --publisher --history --output drc002-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-drc002-${{ github.run_id }}
          path: |
            drc002-receipt.json
            drc002-preflight.json
            drc002-history-audit.json
            reports/HCL_DRC002_PACKAGE.json
            reports/HCL_DRC002_SUBSET.json
