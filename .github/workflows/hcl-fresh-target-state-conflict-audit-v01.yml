name: HCL Fresh Target State-Conflict Audit v0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/HCL_FRESH_TARGET_STATE_CONFLICT_AUDIT_V01_TRIGGER"

permissions:
  contents: read

env:
  ANSWER_REPAIR_BEHAVIOR_ANCHOR: 4ab45463bbeacbe3eb8eaa91be7ec908130ce980
  STATE_CONFLICT_PROTOCOL_ANCHOR: 6e2fca4962eeca07b07648d3f2a7c7562e98df5e

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen behavior and fixtures
        shell: bash
        run: |
          git diff --exit-code "$ANSWER_REPAIR_BEHAVIOR_ANCHOR"..HEAD --             hcl/v03/answer_loop.py             hcl/v03/backends.py             hcl/v03/state_schema.json             hcl/v03/FROZEN_STATE_SEMANTICS.md
          git diff --exit-code "$STATE_CONFLICT_PROTOCOL_ANCHOR"..HEAD --             reports/HCL_FRESH_TARGET_STATE_CONFLICT_AUDIT_V01.md             eval/answer_loop/semantic_faithfulness_fresh_v01.json             scripts/run_fresh_target_state_conflict_audit_v01.py             tests/test_fresh_target_state_conflict_audit_v01.py

      - name: Install zero-provider dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai==2.14.0"

      - name: Compile and run audit checks
        shell: bash
        run: |
          python -m py_compile             scripts/run_fresh_target_state_conflict_audit_v01.py             tests/test_fresh_target_state_conflict_audit_v01.py
          python -m unittest discover -s tests -p test_fresh_target_state_conflict_audit_v01.py -v

  audit:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reverify frozen behavior and audit protocol
        shell: bash
        run: |
          git diff --exit-code "$ANSWER_REPAIR_BEHAVIOR_ANCHOR"..HEAD --             hcl/v03/answer_loop.py             hcl/v03/backends.py             hcl/v03/state_schema.json             hcl/v03/FROZEN_STATE_SEMANTICS.md
          git diff --exit-code "$STATE_CONFLICT_PROTOCOL_ANCHOR"..HEAD --             reports/HCL_FRESH_TARGET_STATE_CONFLICT_AUDIT_V01.md             eval/answer_loop/semantic_faithfulness_fresh_v01.json             scripts/run_fresh_target_state_conflict_audit_v01.py             tests/test_fresh_target_state_conflict_audit_v01.py

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai==2.14.0"

      - name: Run 24-state synthetic conflict audit
        run: |
          python scripts/run_fresh_target_state_conflict_audit_v01.py --workers 4

      - name: Verify complete synthetic evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/hcl-fresh-target-state-conflict-v01")
          s=json.loads((root/"summary.json").read_text())
          rows=[json.loads(x) for x in (root/"states.jsonl").read_text().splitlines() if x.strip()]
          assert s["run_count"] == 24
          assert s["repeats_per_fixture"] == 8
          assert s["audit_complete"] is True
          assert len(rows) == 24
          assert sum(x["fixture_id"]=="sf07_exact_positive_signal" for x in rows) == 8
          assert sum(x["fixture_id"]=="sf02_direct_positive_schedule" for x in rows) == 8
          assert sum(x["fixture_id"]=="sf03_direct_positive_location" for x in rows) == 8
          PY

      - name: Upload full synthetic state evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-fresh-target-state-conflict-v01-${{ github.run_id }}
          path: artifacts/hcl-fresh-target-state-conflict-v01/
          if-no-files-found: error
          retention-days: 30
