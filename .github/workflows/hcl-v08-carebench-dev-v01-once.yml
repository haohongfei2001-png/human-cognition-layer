name: HCL v0.8 CAREBench Development Once
on:
  push:
    branches: [main]
    paths: [".github/HCL_V08_CAREBENCH_DEV_V01_TRIGGER"]
permissions:
  contents: read
concurrency:
  group: hcl-v08-carebench-dev-v01-once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HCL_V08_CAREBENCH_DEV_COST_AUTHORIZED_USD: ${{ vars.HCL_V08_CAREBENCH_DEV_COST_AUTHORIZED_USD }}
      HCL_V08_CAREBENCH_DEV_RUN_ONCE_TOKEN: HCL_V08_CAREBENCH_DEV_V01_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify trigger and separate authorization
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat .github/HCL_V08_CAREBENCH_DEV_V01_TRIGGER)" = "${HCL_V08_CAREBENCH_DEV_RUN_ONCE_TOKEN}|${{ github.event.before }}"
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_V08_CAREBENCH_DEV_V01_TRIGGER"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_V08_CAREBENCH_DEV_V01_TRIGGER"
          if git log --format=%H '${{ github.event.before }}' -- .github/HCL_V08_CAREBENCH_DEV_V01_TRIGGER | grep -q .; then exit 1; fi
          python - <<'PY'
          import os
          assert float(os.getenv('HCL_V08_CAREBENCH_DEV_COST_AUTHORIZED_USD') or '0') >= 0.25
          assert os.getenv('DEEPSEEK_API_KEY')
          PY
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0"
      - name: Pin source and run provider-free checks
        run: |
          mkdir -p .cache artifacts/hcl-v08-carebench-dev-v01
          curl --fail --location --retry 0 'https://huggingface.co/datasets/zhaoyuesun/CAREBecnch/resolve/8b4135219d493c4aaa2474beeefed11779c66890/first_person.json' -o .cache/carebench-first-person.json
          echo '93b410dab0ea3f40796f6e02bf4cb8085898670a340fe2a6f10f154593d6d05c  .cache/carebench-first-person.json' | sha256sum -c -
          python scripts/prepare_v08_carebench_dev_v01.py --source .cache/carebench-first-person.json
          python scripts/run_v08_carebench_dev_v01.py --source .cache/carebench-first-person.json --validate-only
          python -m unittest -v tests.test_v08_affect_runtime tests.test_v08_carebench_dev_v01 tests.test_v07_intention_runtime tests.test_v06_perspective_belief_runtime
      - name: Execute bounded development check once
        run: |
          python scripts/run_v08_carebench_dev_v01.py --source .cache/carebench-first-person.json --execute --out artifacts/hcl-v08-carebench-dev-v01/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-v08-carebench-dev-v01-${{ github.run_id }}
          path: artifacts/hcl-v08-carebench-dev-v01/
          if-no-files-found: warn
          retention-days: 90
