name: HCL Quantifier LogicSkills Strong Reasoning Development Once
on:
  push:
    branches: [main]
    paths: [".github/HCL_QUANTIFIER_LOGICSKILLS_DEV_V01_TRIGGER"]
permissions:
  contents: read
concurrency:
  group: hcl-quantifier-logicskills-dev-v01-once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HCL_QUANTIFIER_LOGICSKILLS_DEV_COST_AUTHORIZED_USD: ${{ vars.HCL_QUANTIFIER_LOGICSKILLS_DEV_COST_AUTHORIZED_USD }}
      HCL_QUANTIFIER_LOGICSKILLS_DEV_RUN_ONCE_TOKEN: HCL_QUANTIFIER_LOGICSKILLS_DEV_V01_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify trigger and separate authorization
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat .github/HCL_QUANTIFIER_LOGICSKILLS_DEV_V01_TRIGGER)" = "${HCL_QUANTIFIER_LOGICSKILLS_DEV_RUN_ONCE_TOKEN}|${{ github.event.before }}"
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_QUANTIFIER_LOGICSKILLS_DEV_V01_TRIGGER"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_QUANTIFIER_LOGICSKILLS_DEV_V01_TRIGGER"
          if git log --format=%H '${{ github.event.before }}' -- .github/HCL_QUANTIFIER_LOGICSKILLS_DEV_V01_TRIGGER | grep -q .; then exit 1; fi
          python - <<'PY'
          import os
          assert float(os.getenv('HCL_QUANTIFIER_LOGICSKILLS_DEV_COST_AUTHORIZED_USD') or '0') >= 0.05
          assert os.getenv('DEEPSEEK_API_KEY')
          PY
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0" "z3-solver==4.15.4.0"
      - name: Pin source and run provider-free checks
        run: |
          mkdir -p .cache/logicskills
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/brianrabern/LogicSkills/31b175699127b766e64eb0c550893396404f665b/Assessors/symbolization/questions_symbolization_english.json' -o .cache/logicskills/english.json
          echo '6c39b461f428536f7b0870b2179cee216d59d7bf4122b213aee85ff5b44d7fe8  .cache/logicskills/english.json' | sha256sum -c -
          python scripts/run_quantifier_logicskills_dev_v01.py --source-file .cache/logicskills/english.json --validate-only
          python -m unittest -v tests.test_quantified_logic tests.test_quantifier_logicskills_dev_v01
      - name: Execute bounded development check once
        run: |
          python scripts/run_quantifier_logicskills_dev_v01.py --source-file .cache/logicskills/english.json --execute --out artifacts/hcl-quantifier-logicskills-dev-v01/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-quantifier-logicskills-dev-v01-${{ github.run_id }}
          path: artifacts/hcl-quantifier-logicskills-dev-v01/
          if-no-files-found: warn
          retention-days: 90
