name: HCL Pragmatic Interpretation Circa Development Once
on:
  push:
    branches: [main]
    paths: [".github/HCL_PRAGMATICS_CIRCA_DEV_V01_TRIGGER"]
permissions:
  contents: read
concurrency:
  group: hcl-pragmatics-circa-dev-v01-once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HCL_PRAGMATICS_CIRCA_DEV_COST_AUTHORIZED_USD: ${{ vars.HCL_PRAGMATICS_CIRCA_DEV_COST_AUTHORIZED_USD }}
      HCL_PRAGMATICS_CIRCA_DEV_RUN_ONCE_TOKEN: HCL_PRAGMATICS_CIRCA_DEV_V01_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify trigger and separate authorization
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat .github/HCL_PRAGMATICS_CIRCA_DEV_V01_TRIGGER)" = "${HCL_PRAGMATICS_CIRCA_DEV_RUN_ONCE_TOKEN}|${{ github.event.before }}"
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_PRAGMATICS_CIRCA_DEV_V01_TRIGGER"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_PRAGMATICS_CIRCA_DEV_V01_TRIGGER"
          if git log --format=%H '${{ github.event.before }}' -- .github/HCL_PRAGMATICS_CIRCA_DEV_V01_TRIGGER | grep -q .; then exit 1; fi
          python - <<'PY'
          import os
          assert float(os.getenv('HCL_PRAGMATICS_CIRCA_DEV_COST_AUTHORIZED_USD') or '0') >= 0.05
          assert os.getenv('DEEPSEEK_API_KEY')
          PY
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0"
      - name: Pin source and run provider-free checks
        run: |
          mkdir -p .cache/circa
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/google-research-datasets/circa/02ad965518ab2fbd8bb24463d312ebb03bac5368/circa-data.tsv' -o .cache/circa/circa-data.tsv
          echo '98454df6b716dd7ff5f83a3db298849f05414688e81c2ee21b8e5a548ed897aa  .cache/circa/circa-data.tsv' | sha256sum -c -
          python scripts/run_pragmatics_circa_dev_v01.py --source-file .cache/circa/circa-data.tsv --validate-only
          python -m unittest -v tests.test_pragmatics_circa_dev_v01 tests.test_v07_intention_runtime tests.test_v06_perspective_belief_runtime
      - name: Execute bounded development check once
        run: |
          python scripts/run_pragmatics_circa_dev_v01.py --source-file .cache/circa/circa-data.tsv --execute --out artifacts/hcl-pragmatics-circa-dev-v01/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-pragmatics-circa-dev-v01-${{ github.run_id }}
          path: artifacts/hcl-pragmatics-circa-dev-v01/
          if-no-files-found: warn
          retention-days: 90
