name: HCL Natural Argument FOLIO Provider-Free Source and Firewall Preflight
on:
  pull_request:
    paths: ["README.md", "hcl/quantified_logic.py", "scripts/*natural_argument_folio*", "scripts/reasoning_probe_backend.py", "tests/test_natural_argument_folio*", "eval/conceptual/**", "docs/HCL_NATURAL_ARGUMENT*", "reports/HCL_NATURAL_ARGUMENT*", "requirements-conceptual.txt", ".github/workflows/hcl-natural-argument*.yml", ".github/workflows/hcl-quantifier*.yml"]
  push:
    branches: [main]
    paths: ["README.md", "hcl/quantified_logic.py", "scripts/*natural_argument_folio*", "scripts/reasoning_probe_backend.py", "tests/test_natural_argument_folio*", "eval/conceptual/**", "docs/HCL_NATURAL_ARGUMENT*", "reports/HCL_NATURAL_ARGUMENT*", "requirements-conceptual.txt", ".github/workflows/hcl-natural-argument*.yml", ".github/workflows/hcl-quantifier*.yml"]
permissions:
  contents: read
jobs:
  provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0" "z3-solver==4.15.4.0"
      - name: Verify fixed public source and zero-call plan
        run: |
          mkdir -p .cache/logicskills
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/Yale-LILY/FOLIO/5d7bb84c7edab3fb358e057d2807f19cf5cf5e2d/data/v0.0/folio-validation.jsonl' -o .cache/logicskills/english.json
          echo '6922c988ef10987bd6545568ee8e63e897af80994591fa20539767da58f8e3d1  .cache/logicskills/english.json' | sha256sum -c -
          python scripts/run_natural_argument_folio_dev_v01.py --source-file .cache/logicskills/english.json --validate-only
          python -m unittest -v tests.test_quantified_logic tests.test_quantifier_logicskills_dev_v01 tests.test_natural_argument_folio_dev_v01
