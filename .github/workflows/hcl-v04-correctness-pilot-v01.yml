name: HCL v0.4 Correctness Pilot v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/HCL_V04_CORRECTNESS_PILOT_TRIGGER"

permissions:
  contents: read

jobs:
  correctness-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install openai
      - name: Run provider-backed correctness pilot
        run: |
          python scripts/run_v04_correctness_pilot.py \
            --model deepseek-flash \
            --fixtures eval/v04/correctness_pilot_v01.json
      - name: Upload correctness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcl-v04-correctness-pilot-${{ github.run_id }}
          path: artifacts/hcl-v04-correctness-pilot/
          if-no-files-found: warn
          retention-days: 30
