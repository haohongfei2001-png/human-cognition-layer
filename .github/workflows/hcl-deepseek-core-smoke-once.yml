# Inert preparation. No trigger marker or READY grant is included in this PR.
# A later authorized E -> grant-only G -> marker-only M chain is required.
# Complete workflow history permanently admits only one first push run; no reruns.
name: HCL core DeepSeek synthetic one-use smoke
on:
  push:
    branches: [main]
    paths: ['.github/HCL_DEEPSEEK_CORE_SMOKE_TRIGGER.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: hcl-core-deepseek-synthetic-v1-once
  cancel-in-progress: false
jobs:
  smoke:
    if: github.repository == 'haohongfei2001-png/human-cognition-layer' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned solver only
        run: python -m pip install -r requirements-conceptual.txt
      - name: Verify exact new grant and marker, existing secret presence only
        env:
          SECRET_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: python -m scripts.deepseek_core_smoke_once --preflight
      - name: Complete permanent workflow-run history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/hcl-deepseek-core-smoke
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/hcl-deepseek-core-smoke-once.yml/runs?per_page=100" > /tmp/hcl-deepseek-core-smoke/runs.json
      - name: One admitted run, fresh price and existing CNY account, then bounded model calls
        env:
          SECRET_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m scripts.deepseek_core_smoke_once --execute
      - name: Close retained holds and export bounded status only
        if: always()
        run: python -m scripts.deepseek_core_smoke_once --export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-core-deepseek-synthetic-${{ github.run_id }}
          path: hcl-deepseek-core-smoke-public.json
          if-no-files-found: ignore
# Never upload the private directory, key, raw HTTP bodies, balances or reasoning.
