name: HCL Development Reality Check Fairness and Final Isolation
on:
  pull_request:
    paths: ['scripts/development*', 'tests/test_development*', 'reports/HCL_DRC*', 'reports/HCL_DEVELOPMENT*', 'docs/HCL_VALIDATION*', '.github/workflows/hcl-development*', '.github/frozen/hcl-drc*', 'hcl/**']
  push:
    branches: [main]
    paths: ['scripts/development*', 'tests/test_development*', 'reports/HCL_DRC*', 'reports/HCL_DEVELOPMENT*', 'docs/HCL_VALIDATION*', '.github/workflows/hcl-development*', '.github/frozen/hcl-drc*', 'hcl/**']
permissions:
  contents: read
jobs:
  development-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_development_drc001_replay tests.test_development_drc002_replay tests.test_i02_rebus_kranak_exposure tests.test_development_dre001_replay
      - run: python -m scripts.development_drc001_replay
      - run: python -m scripts.development_drc002_replay
      - run: python -m scripts.development_dre001_replay
      - run: python -m unittest tests.test_provider_json_contract tests.test_development_drc003_replay
      - run: python -m scripts.development_drc003_replay
      - run: python -m unittest tests.test_development_drc004_replay tests.test_v1_adaptive_reader_entry
      - run: python -m scripts.development_drc004_replay
      - run: python -m unittest tests.test_development_drc005_replay tests.test_v1_ordinary_access_entry
      - run: python -m scripts.development_drc005_replay
      - run: python -m unittest tests.test_development_drc006_replay
      - run: python -m scripts.development_drc006_replay
      - run: python -m unittest tests.test_development_drc007_replay
      - run: python -m scripts.development_drc007_replay
      - run: python -m unittest tests.test_development_drc008_replay
      - run: python -m scripts.development_drc008_replay
      - name: Current ordinary-source inference delivery and runtime boundary
        run: |
          python -m unittest tests.test_v1_source_inference_boundary
          python -m scripts.development_runtime_amendment_v25
