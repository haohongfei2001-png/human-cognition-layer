name: HCL Verification-Deadlock Synthetic v0.2.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/HCL_VERIFICATION_DEADLOCK_V021_TRIGGER"

permissions:
  contents: read

jobs:
  verification-stopping:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai

      - name: Static compile
        shell: bash
        run: |
          python -m py_compile             hcl/v03/decision_policy.py             hcl/v03/action_checker.py             hcl/integrations/sotopia_agent.py             scripts/run_hcl_v03_decision_policy.py             scripts/run_hcl_action_checker.py

      - name: Run verification-stopping decision-policy suite
        shell: bash
        run: |
          python scripts/run_hcl_v03_decision_policy.py             --fixtures eval/decision_policy/fixtures_v04_verification_stopping_synthetic.json             --out artifacts/decision-policy-verification-v021             --seed 42

      - name: Run verification-stopping action-checker suite
        shell: bash
        run: |
          python scripts/run_hcl_action_checker.py             --fixtures eval/action_checker/fixtures_v02_verification_stopping.json             --out artifacts/action-checker-verification-v02

      - name: Regression — negotiation-position suite
        shell: bash
        run: |
          python scripts/run_hcl_v03_decision_policy.py             --fixtures eval/decision_policy/fixtures_v03_negotiation_position_synthetic.json             --out artifacts/decision-policy-negotiation-regression-v021             --seed 42

      - name: Regression — goal-pursuit suite
        shell: bash
        run: |
          python scripts/run_hcl_v03_decision_policy.py             --fixtures eval/decision_policy/fixtures_v02_goal_pursuit_synthetic.json             --out artifacts/decision-policy-goal-regression-v021             --seed 42

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcl-verification-deadlock-v021-${{ github.run_id }}
          path: |
            artifacts/decision-policy-verification-v021/
            artifacts/action-checker-verification-v02/
            artifacts/decision-policy-negotiation-regression-v021/
            artifacts/decision-policy-goal-regression-v021/
            artifacts/goal-pursuit-regression-adjudication-v021/
          if-no-files-found: warn
          retention-days: 30
