name: HCL Pragmatic Interpretation Source and Request Preflight
on:
  pull_request:
    paths: ["hcl/pragmatics.py", "scripts/*pragmatics*", "tests/*pragmatics*", "eval/pragmatics/**", "docs/HCL_PRAGMATICS*", ".github/workflows/hcl-pragmatics*.yml"]
  push:
    branches: [main]
    paths: ["hcl/pragmatics.py", "scripts/*pragmatics*", "tests/*pragmatics*", "eval/pragmatics/**", "docs/HCL_PRAGMATICS*", ".github/workflows/hcl-pragmatics*.yml"]
permissions:
  contents: read
jobs:
  provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0"
      - name: Pinned source and zero-call method checks
        run: |
          mkdir -p .cache/circa
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/google-research-datasets/circa/02ad965518ab2fbd8bb24463d312ebb03bac5368/circa-data.tsv' -o .cache/circa/circa-data.tsv
          echo '98454df6b716dd7ff5f83a3db298849f05414688e81c2ee21b8e5a548ed897aa  .cache/circa/circa-data.tsv' | sha256sum -c -
          python scripts/run_pragmatics_circa_dev_v01.py --source-file .cache/circa/circa-data.tsv --validate-only
          python -m unittest -v tests.test_pragmatics_circa_dev_v01 tests.test_v07_intention_runtime tests.test_v06_perspective_belief_runtime
