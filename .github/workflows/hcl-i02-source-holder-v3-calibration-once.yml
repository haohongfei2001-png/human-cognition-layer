name: HCL I02 One-Time V3 Long Authored Interface Calibration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: First unique main execution only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -f .github/HCL_I02_SOURCE_HOLDER_V3_CALIBRATION_CLOSED
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hcl-i02-source-holder-v3-calibration-once.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/holder-runs.json
          python - <<'PY'
          import json, os
          runs=json.load(open('/tmp/holder-runs.json'))['workflow_runs']
          assert len(runs)==1 and str(runs[0]['id'])==os.environ['GITHUB_RUN_ID']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned existing client
        run: python -m pip install 'openai==2.14.0'
      - name: New authored complete-source/hash/gold-firewall/cost preflight
        run: python -m scripts.run_i02_source_holder_v3_calibration_once --preflight --output i02-v3-interface-preflight.json
      - name: One native long-input interface calibration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HCL_I02_V3_INTERFACE_AUTHORIZED: ONE_NEW_INTERFACE_CALIBRATION_ONLY
        run: python -m scripts.run_i02_source_holder_v3_calibration_once --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-i02-v3-long-interface-calibration-${{ github.run_id }}
          path: |
            i02-v3-interface-preflight.json
            i02-v3-interface-calibration-receipt.json
            reports/HCL_I02_SOURCE_HOLDER_V3_CALIBRATION_PACKAGE.json
