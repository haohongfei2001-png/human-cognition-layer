name: CogToM Baseline

on:
  workflow_dispatch:
    inputs:
      model:
        description: DeepSeek API model
        required: true
        default: deepseek-flash
        type: choice
        options:
          - deepseek-flash
          - deepseek-v4-pro
      language:
        description: CogToM language
        required: true
        default: zh
        type: choice
        options:
          - zh
          - en
      limit:
        description: Number of question groups (each group runs 5 option permutations)
        required: true
        default: "20"
        type: string
      workers:
        description: Parallel API workers
        required: true
        default: "4"
        type: string

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout HCL repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bootstrap pinned CogToM and dependencies
        shell: bash
        run: |
          git clone --quiet https://github.com/Beijing-AISI/CogToM.git .cache/CogToM
          git -C .cache/CogToM checkout --quiet --detach 28c6781b6ea7d7ef7d491f61adc18f076f8b993c
          python -m pip install --upgrade pip
          python -m pip install -r .cache/CogToM/requirements.txt

      - name: Verify secret is configured
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Missing repository secret DEEPSEEK_API_KEY"
            exit 2
          fi

      - name: Run official CogToM baseline
        shell: bash
        run: |
          python scripts/run_cogtom_baseline.py \
            --model "${{ inputs.model }}" \
            --language "${{ inputs.language }}" \
            --limit "${{ inputs.limit }}" \
            --workers "${{ inputs.workers }}"

      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cogtom-${{ inputs.model }}-${{ inputs.language }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
