name: FANToM External Validation v0.1 Inventory

on:
  push:
    branches:
      - main
    paths:
      - ".github/FANTOM_EXT_V01_INVENTORY_TRIGGER"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inventory dependency
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Static compile
        shell: bash
        run: python -m py_compile scripts/inventory_fantom_external_v01.py

      - name: Inventory pinned FANToM and select deterministic pilot IDs
        shell: bash
        run: python scripts/inventory_fantom_external_v01.py

      - name: Verify zero-provider artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/fantom-external-v01-inventory/inventory.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["source"]["commit"] == "1cae6fa30f5ba04ca0fff5f5716b5ba7055e2e85"
          assert data["source"]["dataset_sha256"] == "1d08dfa0ea474c7f83b9bc7e3a7b466eab25194043489dd618b4c5223e1253a4"
          assert data["selection"]["total_selected"] == 32
          assert len(data["selected"]) == 32
          assert len({x["question_id"] for x in data["selected"]}) == 32
          assert "prediction" not in path.read_text(encoding="utf-8").lower()
          PY

      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: fantom-external-v01-inventory-${{ github.run_id }}
          path: artifacts/fantom-external-v01-inventory/
          if-no-files-found: error
          retention-days: 30
