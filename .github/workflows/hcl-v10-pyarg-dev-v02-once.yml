name: HCL v0.10 Public PyArg Author Example Non-Fresh Contract Repair Once
on:
  push:
    branches: [main]
    paths: [".github/HCL_V10_PYARG_DEV_V02_TRIGGER"]
permissions:
  contents: read
concurrency:
  group: hcl-v10-pyarg-dev-v02-once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HCL_V10_PYARG_DEV_V02_COST_AUTHORIZED_USD: ${{ vars.HCL_V10_PYARG_DEV_V02_COST_AUTHORIZED_USD }}
      HCL_V10_PYARG_DEV_V02_RUN_ONCE_TOKEN: HCL_V10_PYARG_DEV_V02_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify trigger and separate authorization
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat .github/HCL_V10_PYARG_DEV_V02_TRIGGER)" = "${HCL_V10_PYARG_DEV_V02_RUN_ONCE_TOKEN}|${{ github.event.before }}"
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_V10_PYARG_DEV_V02_TRIGGER"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_V10_PYARG_DEV_V02_TRIGGER"
          if git log --format=%H '${{ github.event.before }}' -- .github/HCL_V10_PYARG_DEV_V02_TRIGGER | grep -q .; then exit 1; fi
          python - <<'PY'
          import os
          assert float(os.getenv('HCL_V10_PYARG_DEV_V02_COST_AUTHORIZED_USD') or '0') >= 0.05
          assert os.getenv('DEEPSEEK_API_KEY')
          PY
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0"
      - name: Pin source and run provider-free checks
        run: |
          mkdir -p .cache/pyarg-source/src/py_arg_tests
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/DaphneOdekerken/PyArg/f907bac94cbdd663839300b3b7523d4d958ff36f/src/py_arg_tests/test_af_complete_semantics.py' -o .cache/pyarg-source/src/py_arg_tests/test_af_complete_semantics.py
          echo '042eddb4d7e2ce29af8c9403ccf8c315b4cc511c2fa8d0582e750024a8ce1520  .cache/pyarg-source/src/py_arg_tests/test_af_complete_semantics.py' | sha256sum -c -
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/DaphneOdekerken/PyArg/f907bac94cbdd663839300b3b7523d4d958ff36f/src/py_arg_tests/test_incomplete_argumentation_framework.py' -o .cache/pyarg-source/src/py_arg_tests/test_incomplete_argumentation_framework.py
          echo '4985affc9d468b8432be8ff6a9a7250fb54b5323b05ad6f81d3d1cfbd1b57b3f  .cache/pyarg-source/src/py_arg_tests/test_incomplete_argumentation_framework.py' | sha256sum -c -
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/DaphneOdekerken/PyArg/f907bac94cbdd663839300b3b7523d4d958ff36f/src/py_arg_tests/test_af_from_scratch.py' -o .cache/pyarg-source/src/py_arg_tests/test_af_from_scratch.py
          echo '649d20725245d64e3c72bb9393b1c6ed2b30b2f7358d00b79a577777062f6110  .cache/pyarg-source/src/py_arg_tests/test_af_from_scratch.py' | sha256sum -c -
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/DaphneOdekerken/PyArg/f907bac94cbdd663839300b3b7523d4d958ff36f/src/py_arg_tests/test_af_canonical_constructions.py' -o .cache/pyarg-source/src/py_arg_tests/test_af_canonical_constructions.py
          echo '607b86304a6748c94ac09b027734437244cd8ae8ac60d8c7e19457ecce4ff701  .cache/pyarg-source/src/py_arg_tests/test_af_canonical_constructions.py' | sha256sum -c -
          python scripts/prepare_v10_pyarg_dev_v01.py --source-dir .cache/pyarg-source
          python scripts/run_v10_pyarg_dev_v02.py --source-dir .cache/pyarg-source --validate-only
          mkdir -p artifacts/hcl-v10-pyarg-dev-v02
          python -m unittest -v tests.test_v10_argumentation_runtime tests.test_v10_pyarg_dev_v01 tests.test_v10_pyarg_dev_v02 tests.test_v07_intention_runtime tests.test_v06_perspective_belief_runtime
      - name: Execute bounded development check once
        run: |
          python scripts/run_v10_pyarg_dev_v02.py --source-dir .cache/pyarg-source --execute --out artifacts/hcl-v10-pyarg-dev-v02/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-v10-pyarg-dev-v02-${{ github.run_id }}
          path: artifacts/hcl-v10-pyarg-dev-v02/
          if-no-files-found: warn
          retention-days: 90
