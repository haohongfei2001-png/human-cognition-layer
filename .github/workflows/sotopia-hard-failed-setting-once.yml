name: SOTOPIA-Hard Failed-Setting Closure

on:
  push:
    branches:
      - main
    paths:
      - ".github/SOTOPIA_HARD_FAILED_SETTING_TRIGGER"

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CUSTOM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SOTOPIA_STORAGE_BACKEND: redis
      REDIS_OM_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned SOTOPIA
        shell: bash
        run: |
          git clone --quiet https://github.com/sotopia-lab/sotopia.git .cache/sotopia
          git -C .cache/sotopia checkout --quiet --detach a0aaafb440e570e5e61b7c44a44e5e417c545383
          python -m pip install --upgrade pip
          python -m pip install -e .cache/sotopia
          python -m pip install             "pydantic==2.9.2"             "redis-om==0.3.2"             "redis==5.1.1"             "openai==2.14.0"             "litellm==1.80.11"

      - name: Load official SOTOPIA dataset into Redis
        shell: bash
        run: |
          mkdir -p .cache/redis-data
          curl -L --fail --retry 3             "https://huggingface.co/datasets/cmu-lti/sotopia-pi/resolve/main/dump.rdb?download=true"             -o .cache/redis-data/dump.rdb
          test -s .cache/redis-data/dump.rdb
          docker run -d             --name hcl-sotopia-redis             -p 6379:6379             -v "$PWD/.cache/redis-data:/data"             redis/redis-stack-server:latest
          for i in {1..30}; do
            if docker exec hcl-sotopia-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker logs hcl-sotopia-redis
          exit 1

      - name: Run failed setting closure
        shell: bash
        run: |
          python scripts/run_sotopia_hard_slice_ab.py --start 0 --count 1

      - name: Upload closure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sotopia-hard-failed-setting-${{ github.run_id }}
          path: artifacts/sotopia-hard-slice-ab/
          if-no-files-found: warn
          retention-days: 30
