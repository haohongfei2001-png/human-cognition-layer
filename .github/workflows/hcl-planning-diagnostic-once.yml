name: HCL I02 One Separately Approved Planning Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/HCL_PLANNING_DIAGNOSTIC_TRIGGER.json"]
permissions:
  contents: read
  actions: read
concurrency:
  group: hcl-one-planning-diagnostic-new-grant
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==2.14.0' 'cryptography==50.0.0'
      - name: Provider-free diagnostic executor gates
        run: python -m unittest tests.test_planning_diagnostic tests.test_v1_deepseek_metered tests.test_universal_encrypted_result
      - name: One fresh grant across both launch routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/hcl-planning-diagnostic-once.yml/runs?per_page=100" > /tmp/planning-runs.json
          python -m scripts.run_planning_diagnostic --check-launch /tmp/planning-runs.json
      - name: Exactly one planning call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m scripts.run_planning_diagnostic --execute
      - name: Encrypt private receipt
        if: always()
        run: |
          if test -f planning-diagnostic-private/receipt.json; then
            python -m scripts.universal_encrypted_result --receipt planning-diagnostic-private/receipt.json --public-key .github/HCL_UNIVERSAL_DEVELOPMENT_RECIPIENT.pem --output planning-diagnostic.enc.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-planning-diagnostic-encrypted-${{ github.run_id }}
          path: planning-diagnostic.enc.json
          if-no-files-found: warn
