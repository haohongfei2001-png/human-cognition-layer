name: HCL Narrative TORQUE Generic Temporal Tool Non-Fresh Transport Repair Once
on:
  push:
    branches: [main]
    paths: [".github/HCL_NARRATIVE_TORQUE_DEV_V02_TRIGGER"]
permissions:
  contents: read
concurrency:
  group: hcl-narrative-torque-dev-v02-once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HCL_NARRATIVE_TORQUE_DEV_V02_COST_AUTHORIZED_USD: ${{ vars.HCL_NARRATIVE_TORQUE_DEV_V02_COST_AUTHORIZED_USD }}
      HCL_NARRATIVE_TORQUE_DEV_RUN_ONCE_TOKEN: HCL_NARRATIVE_TORQUE_DEV_V02_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify trigger and separate authorization
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat .github/HCL_NARRATIVE_TORQUE_DEV_V02_TRIGGER)" = "${HCL_NARRATIVE_TORQUE_DEV_RUN_ONCE_TOKEN}|${{ github.event.before }}"
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_NARRATIVE_TORQUE_DEV_V02_TRIGGER"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_NARRATIVE_TORQUE_DEV_V02_TRIGGER"
          if git log --format=%H '${{ github.event.before }}' -- .github/HCL_NARRATIVE_TORQUE_DEV_V02_TRIGGER | grep -q .; then exit 1; fi
          python - <<'PY'
          import os
          assert float(os.getenv('HCL_NARRATIVE_TORQUE_DEV_V02_COST_AUTHORIZED_USD') or '0') >= 0.10
          assert os.getenv('DEEPSEEK_API_KEY')
          PY
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0"
      - name: Pin source and run provider-free checks
        run: |
          mkdir -p .cache/torque
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/qiangning/TORQUE-dataset/ab27019cc6a317fde3c879900499f02acce8b16d/data/dev.json' -o .cache/torque/dev.json
          echo '7a8dd84c984f28a5284bdfda57b447218e1269cd2eaf05b5e173394fc1522434  .cache/torque/dev.json' | sha256sum -c -
          python scripts/run_narrative_torque_dev_v02.py --source-file .cache/torque/dev.json --validate-only
          python -m unittest -v tests.test_narrative_order tests.test_narrative_torque_dev_v01 tests.test_narrative_torque_dev_v02 tests.test_v07_intention_runtime tests.test_v06_perspective_belief_runtime
      - name: Execute bounded development check once
        run: |
          python scripts/run_narrative_torque_dev_v02.py --source-file .cache/torque/dev.json --execute --out artifacts/hcl-narrative-torque-dev-v02/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-narrative-torque-dev-v02-${{ github.run_id }}
          path: artifacts/hcl-narrative-torque-dev-v02/
          if-no-files-found: warn
          retention-days: 90
