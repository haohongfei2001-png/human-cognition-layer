name: HCL Public Value Perspective CLASH Development Once
on:
  push:
    branches: [main]
    paths: [".github/HCL_VALUE_CLASH_DEV_V01_TRIGGER"]
permissions:
  contents: read
concurrency:
  group: hcl-value-clash-dev-v01-once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HCL_VALUE_CLASH_DEV_COST_AUTHORIZED_USD: ${{ vars.HCL_VALUE_CLASH_DEV_COST_AUTHORIZED_USD }}
      HCL_VALUE_CLASH_DEV_RUN_ONCE_TOKEN: HCL_VALUE_CLASH_DEV_V01_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify trigger and separate authorization
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat .github/HCL_VALUE_CLASH_DEV_V01_TRIGGER)" = "${HCL_VALUE_CLASH_DEV_RUN_ONCE_TOKEN}|${{ github.event.before }}"
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_VALUE_CLASH_DEV_V01_TRIGGER"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_VALUE_CLASH_DEV_V01_TRIGGER"
          if git log --format=%H '${{ github.event.before }}' -- .github/HCL_VALUE_CLASH_DEV_V01_TRIGGER | grep -q .; then exit 1; fi
          python - <<'PY'
          import os
          assert float(os.getenv('HCL_VALUE_CLASH_DEV_COST_AUTHORIZED_USD') or '0') >= 0.05
          assert os.getenv('DEEPSEEK_API_KEY')
          PY
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0"
      - name: Pin source and run provider-free checks
        run: |
          mkdir -p .cache/clash
          curl --fail --location --retry 0 'https://huggingface.co/datasets/launch/CLASH/resolve/744ec8d62681038a9f44aaba2f737ebd83e8b0d3/dataset.csv' -o .cache/clash/dataset.csv
          echo 'd8f36e232670f3e20762258994930ac10b7f47e2360a461f1cd87ec72ccb92f3  .cache/clash/dataset.csv' | sha256sum -c -
          python scripts/run_value_clash_dev_v01.py --source-file .cache/clash/dataset.csv --validate-only
          python -m unittest -v tests.test_value_perspective_dev_v01 tests.test_v07_intention_runtime tests.test_v06_perspective_belief_runtime
      - name: Execute bounded development check once
        run: |
          python scripts/run_value_clash_dev_v01.py --source-file .cache/clash/dataset.csv --execute --out artifacts/hcl-value-clash-dev-v01/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-value-clash-dev-v01-${{ github.run_id }}
          path: artifacts/hcl-value-clash-dev-v01/
          if-no-files-found: warn
          retention-days: 90
