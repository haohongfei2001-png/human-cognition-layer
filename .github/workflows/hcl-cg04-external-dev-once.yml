name: HCL CG-04 External Development Once

on:
  push:
    branches: [main]
    paths: ['.github/HCL_CG04_EXTERNAL_DEV_TRIGGER']

permissions:
  contents: read

concurrency:
  group: hcl-cg04-external-dev-once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # No CG-04 paid run is authorized; a new one-time owner grant is required.
      HCL_CG04_AUTHORIZED_CAP_USD: "0"
      HCL_CG04_AUTHORIZED_BASE_SHA: UNAUTHORIZED
      HCL_CG04_FROZEN_RUNTIME_SHA: 018afbc93c645975d7f6f1077c8c8380635d9f2f
      HCL_CG04_FROZEN_PACKAGE_SHA256: 0ffcfdfae3d9d5130c96205f2247991d1d88a872edbb144b701ad01da3202ce9
      HCL_CG04_RUN_ONCE_TOKEN: HCL_CG04_EXTERNAL_DEV_OWNER_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify unique trigger and owner grant
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$HCL_CG04_AUTHORIZED_CAP_USD" = "0.30"
          test "$HCL_CG04_AUTHORIZED_BASE_SHA" = "$HCL_CG04_FROZEN_RUNTIME_SHA"
          git merge-base --is-ancestor "$HCL_CG04_AUTHORIZED_BASE_SHA" HEAD
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat .github/HCL_CG04_EXTERNAL_DEV_TRIGGER)" = "${HCL_CG04_RUN_ONCE_TOKEN}|${{ github.event.before }}"
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_CG04_EXTERNAL_DEV_TRIGGER"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_CG04_EXTERNAL_DEV_TRIGGER"
          if git log --format=%H '${{ github.event.before }}' -- .github/HCL_CG04_EXTERNAL_DEV_TRIGGER | grep -q .; then exit 1; fi
          echo "$HCL_CG04_FROZEN_PACKAGE_SHA256  reports/HCL_CG04_EXTERNAL_PACKAGE.json" | sha256sum -c -
          test -n "$DEEPSEEK_API_KEY"

      - name: Record control checkout separately from frozen execution
        run: |
          mkdir -p artifacts/hcl-cg04-external
          python - <<'PYCODE'
          import json, os, pathlib
          pathlib.Path('artifacts/hcl-cg04-external/control-receipt.json').write_text(json.dumps(dict(
              control_sha=os.environ['GITHUB_SHA'], control_before='${{ github.event.before }}',
              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              authorized_runtime_sha=os.environ['HCL_CG04_AUTHORIZED_BASE_SHA'],
              frozen_runtime_sha=os.environ['HCL_CG04_FROZEN_RUNTIME_SHA'],
              frozen_package_sha256=os.environ['HCL_CG04_FROZEN_PACKAGE_SHA256'],
              owner_grant_cap_usd=os.environ['HCL_CG04_AUTHORIZED_CAP_USD']), indent=2) + '\n')
          PYCODE

      - name: Checkout immutable certified CG04 execution runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HCL_CG04_FROZEN_RUNTIME_SHA }}
          path: frozen-cg04
          fetch-depth: 0

      - run: python -m pip install "openai==2.14.0"

      - name: Provider-free treatment-presence preflight
        working-directory: frozen-cg04
        run: |
          test "$(git rev-parse HEAD)" = "$HCL_CG04_FROZEN_RUNTIME_SHA"
          echo "$HCL_CG04_FROZEN_PACKAGE_SHA256  reports/HCL_CG04_EXTERNAL_PACKAGE.json" | sha256sum -c -
          python scripts/cg04_external_package.py
          python -m unittest -v tests.test_v1_cg04 tests.test_v1_cg04_package
          python -m scripts.run_cg04_external_once --out ../artifacts/hcl-cg04-external --validate-only

      - name: Execute one bounded DeepSeek comparison
        working-directory: frozen-cg04
        run: python -m scripts.run_cg04_external_once --out ../artifacts/hcl-cg04-external

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-cg04-external-${{ github.run_id }}
          path: artifacts/hcl-cg04-external/
          if-no-files-found: warn
          retention-days: 90
