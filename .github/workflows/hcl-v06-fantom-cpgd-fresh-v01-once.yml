name: HCL v0.6 FANToM Fresh C/P/G/D Once

on:
  push:
    branches: [main]
    paths:
      - ".github/HCL_V06_FANTOM_CPGD_FRESH_V01_TRIGGER"

permissions:
  contents: read

concurrency:
  group: hcl-v06-fantom-cpgd-fresh-v01-once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HCL_V06_FRESH_COST_AUTHORIZED_USD: ${{ vars.HCL_V06_FRESH_COST_AUTHORIZED_USD }}
      HCL_V06_FRESH_RUN_ONCE_TOKEN: HCL_V06_FANTOM_CPGD_FRESH_V01_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce exact-parent first-attempt trigger
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat .github/HCL_V06_FANTOM_CPGD_FRESH_V01_TRIGGER)" = "${HCL_V06_FRESH_RUN_ONCE_TOKEN}|${{ github.event.before }}"
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_V06_FANTOM_CPGD_FRESH_V01_TRIGGER"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_V06_FANTOM_CPGD_FRESH_V01_TRIGGER"
          if git log --format=%H '${{ github.event.before }}' -- .github/HCL_V06_FANTOM_CPGD_FRESH_V01_TRIGGER | grep -q .; then exit 1; fi
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0"
      - name: Verify budget authorization before any provider call
        run: |
          python - <<'PY'
          import os
          assert float(os.getenv("HCL_V06_FRESH_COST_AUTHORIZED_USD") or "0") >= 3.50
          assert os.getenv("DEEPSEEK_API_KEY")
          PY
      - name: Download and verify pinned public data
        run: |
          mkdir -p .cache artifacts/hcl-v06-fantom-cpgd-fresh-v01
          curl -L --fail --retry 4 --retry-delay 5 \
            'https://storage.googleapis.com/ai2-mosaic-public/projects/fantom/fantom.tar.gz' \
            -o .cache/fantom.tar.gz
          echo '1d08dfa0ea474c7f83b9bc7e3a7b466eab25194043489dd618b4c5223e1253a4  .cache/fantom.tar.gz' | sha256sum -c -
      - name: Reproduce frozen selection and zero-provider regressions
        run: |
          python scripts/prepare_v06_fantom_cpgd_fresh_v01.py \
            --fantom-archive .cache/fantom.tar.gz \
            --mechanism-main 47f26c9fa106ed4b8f7e0253c2fedbf518fc312a \
            --out .cache/fresh-selection.json
          cmp .cache/fresh-selection.json eval/v06/fantom_cpgd_fresh_selection_v01.json
          python scripts/run_v06_fantom_cpgd_fresh_v01.py \
            --fantom-archive .cache/fantom.tar.gz --validate-only
          python -m unittest -v tests.test_v06_fantom_cpgd_fresh_v01 tests.test_v06_perspective_belief_runtime tests.test_v06_conversation_adapter
      - name: Execute one bounded fresh pilot
        run: |
          python scripts/run_v06_fantom_cpgd_fresh_v01.py \
            --fantom-archive .cache/fantom.tar.gz --execute \
            --out artifacts/hcl-v06-fantom-cpgd-fresh-v01/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-v06-fantom-cpgd-fresh-v01-${{ github.run_id }}
          path: artifacts/hcl-v06-fantom-cpgd-fresh-v01/
          if-no-files-found: warn
          retention-days: 90
