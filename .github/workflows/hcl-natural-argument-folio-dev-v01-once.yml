name: HCL Natural Argument FOLIO Development Once
on:
  push:
    branches: [main]
    paths: [".github/HCL_NATURAL_ARGUMENT_FOLIO_DEV_V01_TRIGGER"]
permissions:
  contents: read
concurrency:
  group: hcl-natural-argument-folio-dev-v01-once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Unapproved new scope: dormant job-local grant0 until owner authorization.
      # Original single-trigger history and attempt guards remain unchanged.
      HCL_NATURAL_ARGUMENT_FOLIO_DEV_COST_AUTHORIZED_USD: "0"
      HCL_NATURAL_ARGUMENT_FOLIO_DEV_RUN_ONCE_TOKEN: HCL_NATURAL_ARGUMENT_FOLIO_DEV_V01_ONCE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify trigger and separate authorization
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat .github/HCL_NATURAL_ARGUMENT_FOLIO_DEV_V01_TRIGGER)" = "${HCL_NATURAL_ARGUMENT_FOLIO_DEV_RUN_ONCE_TOKEN}|${{ github.event.before }}"
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_NATURAL_ARGUMENT_FOLIO_DEV_V01_TRIGGER"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = ".github/HCL_NATURAL_ARGUMENT_FOLIO_DEV_V01_TRIGGER"
          if git log --format=%H '${{ github.event.before }}' -- .github/HCL_NATURAL_ARGUMENT_FOLIO_DEV_V01_TRIGGER | grep -q .; then exit 1; fi
          python - <<'PY'
          import os
          assert float(os.getenv('HCL_NATURAL_ARGUMENT_FOLIO_DEV_COST_AUTHORIZED_USD') or '0') >= 0.05
          assert os.getenv('DEEPSEEK_API_KEY')
          PY
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0" "z3-solver==4.15.4.0"
      - name: Pin source and run provider-free checks
        run: |
          mkdir -p .cache/logicskills
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/Yale-LILY/FOLIO/5d7bb84c7edab3fb358e057d2807f19cf5cf5e2d/data/v0.0/folio-validation.jsonl' -o .cache/logicskills/english.json
          echo '6922c988ef10987bd6545568ee8e63e897af80994591fa20539767da58f8e3d1  .cache/logicskills/english.json' | sha256sum -c -
          python scripts/run_natural_argument_folio_dev_v01.py --source-file .cache/logicskills/english.json --validate-only
          python -m unittest -v tests.test_quantified_logic tests.test_quantifier_logicskills_dev_v01 tests.test_natural_argument_folio_dev_v01
      - name: Execute bounded development check once
        run: |
          python scripts/run_natural_argument_folio_dev_v01.py --source-file .cache/logicskills/english.json --execute --out artifacts/hcl-natural-argument-folio-dev-v01/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-natural-argument-folio-dev-v01-${{ github.run_id }}
          path: artifacts/hcl-natural-argument-folio-dev-v01/
          if-no-files-found: warn
          retention-days: 90
