name: HCL I02 Aggregate-Bound Output-Limit Continuation
on:
  push:
    branches: [main]
    paths: ['.github/HCL_OUTPUT_LIMIT_CONTINUATION_TRIGGER.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: hcl-i02-output-limit-continuation-20261002
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==2.14.0' 'cryptography==50.0.0'
      - name: Provider-free frozen diagnostic gates
        run: python -m unittest tests.test_output_limit_continuation tests.test_v1_deepseek_metered tests.test_universal_encrypted_result
      - name: One new separately ledgered run before expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/hcl-output-limit-continuation-once.yml/runs?per_page=100" > /tmp/output-limit-runs.json
          python -m scripts.run_output_limit_continuation --check-launch /tmp/output-limit-runs.json
      - name: Exact source-backed planning limit comparison then G05
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m scripts.run_output_limit_continuation --execute
      - name: Encrypt receipt without reasoning text or raw errors
        if: always()
        run: |
          if test -f output-limit-private/receipt.json; then
            python -m scripts.universal_encrypted_result --receipt output-limit-private/receipt.json --public-key .github/HCL_UNIVERSAL_DEVELOPMENT_RECIPIENT.pem --output output-limit.enc.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-output-limit-encrypted-${{ github.run_id }}
          path: output-limit.enc.json
          if-no-files-found: warn
