name: HCL I02 Full Source V9 Comparator Provider-Free
on:
  pull_request:
    paths: ['scripts/serious_eval_full_source_arms_v9.py', 'scripts/witness_i02_full_source_arms_v9.py', 'tests/test_i02_full_source_arms_v9.py', 'reports/HCL_I02_FULL_SOURCE_ARMS_V9*', '.github/workflows/hcl-i02-full-source-v9-provider-free.yml']
  push:
    branches: [main]
    paths: ['scripts/serious_eval_full_source_arms_v9.py', 'scripts/witness_i02_full_source_arms_v9.py', 'tests/test_i02_full_source_arms_v9.py', 'reports/HCL_I02_FULL_SOURCE_ARMS_V9*', '.github/workflows/hcl-i02-full-source-v9-provider-free.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'z3-solver==4.15.1.0'
      - run: python -m unittest tests.test_i02_full_source_arms_v9 tests.test_i02_source_holder_reference_budget_v5 tests.test_i02_source_holder_typed_contract_v4 tests.test_i02_source_holder_line_index_v3
      - run: python -m scripts.witness_i02_full_source_arms_v9 --output full-source-v9-witness.json
      - uses: actions/upload-artifact@v4
        with:
          name: hcl-i02-full-source-v9-${{ github.run_id }}
          path: full-source-v9-witness.json
