name: HCL v0.5 LongMemEval C/D/G Provider-Free Preflight

on:
  pull_request:
    paths:
      - "eval/longmemeval/knowledge_update_selection_v01.json"
      - "scripts/longmemeval_cdg_v01.py"
      - "scripts/preflight_v05_longmemeval_cdg_v01.py"
      - "scripts/run_v05_longmemeval_cdg_v01.py"
      - "scripts/score_v05_longmemeval_cdg_v01.py"
      - "scripts/summarize_v05_longmemeval_cdg_v01.py"
      - "scripts/combine_v05_longmemeval_cdg_v01.py"
      - "scripts/probe_v05_longmemeval_cdg_access_v01.py"
      - ".github/workflows/hcl-v05-longmemeval-cdg-v01-once.yml"
      - "tests/test_v05_longmemeval_cdg_v01.py"
      - ".github/workflows/hcl-v05-longmemeval-cdg-preflight.yml"
  push:
    branches:
      - main
    paths:
      - "eval/longmemeval/knowledge_update_selection_v01.json"
      - "scripts/longmemeval_cdg_v01.py"
      - "scripts/preflight_v05_longmemeval_cdg_v01.py"
      - "scripts/run_v05_longmemeval_cdg_v01.py"
      - "scripts/score_v05_longmemeval_cdg_v01.py"
      - "scripts/summarize_v05_longmemeval_cdg_v01.py"
      - "scripts/combine_v05_longmemeval_cdg_v01.py"
      - "scripts/probe_v05_longmemeval_cdg_access_v01.py"
      - ".github/workflows/hcl-v05-longmemeval-cdg-v01-once.yml"
      - "tests/test_v05_longmemeval_cdg_v01.py"
      - ".github/workflows/hcl-v05-longmemeval-cdg-preflight.yml"

permissions:
  contents: read

env:
  DATASET_REVISION: 98d7416c24c778c2fee6e6f3006e7a073259d48f
  DATASET_SHA256: d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provider-free C/D/G tests
        run: |
          python -m compileall -q scripts/longmemeval_cdg_v01.py scripts/*v05_longmemeval_cdg_v01.py
          python -m unittest -v tests.test_v05_longmemeval_cdg_v01
          python scripts/probe_v05_longmemeval_cdg_access_v01.py --validate-only
      - name: Download pinned cleaned-S
        run: |
          mkdir -p .cache/longmemeval
          curl -L --fail --retry 4 --retry-delay 5 \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/${DATASET_REVISION}/longmemeval_s_cleaned.json?download=true" \
            -o .cache/longmemeval/longmemeval_s_cleaned.json
          echo "${DATASET_SHA256}  .cache/longmemeval/longmemeval_s_cleaned.json" | sha256sum -c -
      - name: Verify sealed history hashes without provider calls
        run: |
          python scripts/preflight_v05_longmemeval_cdg_v01.py \
            --dataset .cache/longmemeval/longmemeval_s_cleaned.json \
            --out artifacts/longmemeval-cdg-preflight-v01/manifest.json
          python scripts/run_v05_longmemeval_cdg_v01.py --validate-only \
            --dataset .cache/longmemeval/longmemeval_s_cleaned.json
      - name: Verify pinned official judge source without provider calls
        run: |
          curl -L --fail --retry 4 --retry-delay 5 \
            "https://raw.githubusercontent.com/xiaowu0162/LongMemEval/9e0b455f4ef0e2ab8f2e582289761153549043fc/src/evaluation/evaluate_qa.py" \
            -o .cache/longmemeval/evaluate_qa.py
          test "$(git hash-object .cache/longmemeval/evaluate_qa.py)" = \
            "4732f3772b04a2b9069121ade304e6320494abc2"
          python scripts/score_v05_longmemeval_cdg_v01.py \
            --official-judge-source .cache/longmemeval/evaluate_qa.py \
            --validate-only
      - name: Verify redacted artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('artifacts/longmemeval-cdg-preflight-v01/manifest.json').read_text())
          assert x['provider_calls'] == 0 and x['selected_count'] == 32
          assert x['abstention_id_count'] == 2 and len(x['rows']) == 32
          assert all(set(y) == {'question_id','history_sha256','session_count','event_count'} for y in x['rows'])
          assert not ({'question','answer','answer_session_ids','history','raw_text'} & set(x))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hcl-v05-longmemeval-cdg-preflight-${{ github.run_id }}
          path: artifacts/longmemeval-cdg-preflight-v01/manifest.json
          if-no-files-found: error
          retention-days: 90
