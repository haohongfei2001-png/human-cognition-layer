name: HCL v0.5 LongMemEval C/D/G v0.1 Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/HCL_V05_LONGMEMEVAL_CDG_V01_TRIGGER"

permissions:
  contents: read

concurrency:
  group: hcl-v05-longmemeval-cdg-v01-once
  cancel-in-progress: false

env:
  DATASET_REVISION: 98d7416c24c778c2fee6e6f3006e7a073259d48f
  DATASET_SHA256: d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442
  TRIGGER_PATH: .github/HCL_V05_LONGMEMEVAL_CDG_V01_TRIGGER
  RUN_ONCE_TOKEN: HCL_V05_LONGMEMEVAL_CDG_V01_RUN_ONCE_20260925_A1
  HCL_LONGMEMEVAL_CDG_V01_RUN_ONCE_TOKEN: HCL_V05_LONGMEMEVAL_CDG_V01_RUN_ONCE_20260925_A1

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce immutable exact-parent trigger
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git show -s --format=%P HEAD)" = "${{ github.event.before }}"
          test "$(cat "$TRIGGER_PATH")" = "${RUN_ONCE_TOKEN}|${{ github.event.before }}"
          if git log --format=%H "${{ github.event.before }}" -- "$TRIGGER_PATH" | grep -q .; then
            echo "Trigger existed before this run"
            exit 1
          fi
          test "$(git diff --diff-filter=A --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = "$TRIGGER_PATH"
          test "$(git diff --name-only '${{ github.event.before }}' "$GITHUB_SHA")" = "$TRIGGER_PATH"
      - name: Run provider-free gates
        run: |
          python -m unittest -v tests.test_v05_longmemeval_cdg_v01
          python scripts/probe_v05_longmemeval_cdg_access_v01.py --validate-only
          python scripts/run_v05_longmemeval_cdg_v01.py --validate-only
      - name: Download and verify pinned dataset
        run: |
          mkdir -p .cache/longmemeval
          curl -L --fail --retry 4 --retry-delay 5 \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/${DATASET_REVISION}/longmemeval_s_cleaned.json?download=true" \
            -o .cache/longmemeval/longmemeval_s_cleaned.json
          echo "${DATASET_SHA256}  .cache/longmemeval/longmemeval_s_cleaned.json" | sha256sum -c -
          python scripts/preflight_v05_longmemeval_cdg_v01.py \
            --dataset .cache/longmemeval/longmemeval_s_cleaned.json \
            --out artifacts/longmemeval-cdg-v01/preflight.json
          python - <<'PY'
          import json
          x=json.load(open('artifacts/longmemeval-cdg-v01/preflight.json'))
          assert x['selected_count']==32 and x['total_events']==15601
          assert x['abstention_id_count']==2 and x['provider_calls']==0
          PY
      - name: Verify pinned official judge source
        run: |
          curl -L --fail --retry 4 --retry-delay 5 \
            "https://raw.githubusercontent.com/xiaowu0162/LongMemEval/9e0b455f4ef0e2ab8f2e582289761153549043fc/src/evaluation/evaluate_qa.py" \
            -o .cache/longmemeval/evaluate_qa.py
          test "$(git hash-object .cache/longmemeval/evaluate_qa.py)" = \
            "4732f3772b04a2b9069121ade304e6320494abc2"
          python scripts/score_v05_longmemeval_cdg_v01.py \
            --official-judge-source .cache/longmemeval/evaluate_qa.py \
            --validate-only
      - name: Install frozen provider client
        run: python -m pip install "openai==2.14.0"
      - name: Probe DeepSeek, Qwen and official judge before sealed rows
        run: |
          python scripts/probe_v05_longmemeval_cdg_access_v01.py --probe \
            --out artifacts/longmemeval-cdg-v01/access-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-v05-longmemeval-cdg-preflight-${{ github.run_id }}
          path: artifacts/longmemeval-cdg-v01/
          if-no-files-found: warn
          retention-days: 90

  answers:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify first attempt and install client
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python -m pip install "openai==2.14.0"
      - name: Download and verify pinned dataset
        run: |
          mkdir -p .cache/longmemeval
          curl -L --fail --retry 4 --retry-delay 5 \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/${DATASET_REVISION}/longmemeval_s_cleaned.json?download=true" \
            -o .cache/longmemeval/longmemeval_s_cleaned.json
          echo "${DATASET_SHA256}  .cache/longmemeval/longmemeval_s_cleaned.json" | sha256sum -c -
      - name: Answer sealed C/D/G shard once
        run: |
          python scripts/run_v05_longmemeval_cdg_v01.py --execute \
            --dataset .cache/longmemeval/longmemeval_s_cleaned.json \
            --shard-index ${{ matrix.shard }} --shard-count 8 \
            --out artifacts/longmemeval-cdg-v01/raw-answers-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-v05-longmemeval-cdg-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/longmemeval-cdg-v01/
          if-no-files-found: warn
          retention-days: 90

  judge:
    needs: answers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify first attempt and install client
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python -m pip install "openai==2.14.0"
      - uses: actions/download-artifact@v4
        with:
          pattern: hcl-v05-longmemeval-cdg-shard-*-${{ github.run_id }}
          path: .cache/answer-shards
          merge-multiple: true
      - name: Combine complete shards before judge access
        run: |
          python scripts/combine_v05_longmemeval_cdg_v01.py \
            --shard-dir .cache/answer-shards \
            --out artifacts/longmemeval-cdg-v01/raw-answers.json
      - name: Download pinned sources
        run: |
          mkdir -p .cache/longmemeval
          curl -L --fail --retry 4 --retry-delay 5 \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/${DATASET_REVISION}/longmemeval_s_cleaned.json?download=true" \
            -o .cache/longmemeval/longmemeval_s_cleaned.json
          echo "${DATASET_SHA256}  .cache/longmemeval/longmemeval_s_cleaned.json" | sha256sum -c -
          curl -L --fail --retry 4 --retry-delay 5 \
            "https://raw.githubusercontent.com/xiaowu0162/LongMemEval/9e0b455f4ef0e2ab8f2e582289761153549043fc/src/evaluation/evaluate_qa.py" \
            -o .cache/longmemeval/evaluate_qa.py
          test "$(git hash-object .cache/longmemeval/evaluate_qa.py)" = \
            "4732f3772b04a2b9069121ade304e6320494abc2"
      - name: Judge frozen answers once
        run: |
          python scripts/score_v05_longmemeval_cdg_v01.py --score \
            --official-judge-source .cache/longmemeval/evaluate_qa.py \
            --dataset .cache/longmemeval/longmemeval_s_cleaned.json \
            --raw-answers artifacts/longmemeval-cdg-v01/raw-answers.json \
            --out artifacts/longmemeval-cdg-v01/judge-results.json
      - name: Build provider-free paired summary
        run: |
          python scripts/summarize_v05_longmemeval_cdg_v01.py \
            --raw-answers artifacts/longmemeval-cdg-v01/raw-answers.json \
            --judge-results artifacts/longmemeval-cdg-v01/judge-results.json \
            --out artifacts/longmemeval-cdg-v01/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-v05-longmemeval-cdg-judge-${{ github.run_id }}
          path: artifacts/longmemeval-cdg-v01/
          if-no-files-found: warn
          retention-days: 90
