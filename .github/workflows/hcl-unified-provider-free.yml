name: HCL Unified Runtime Provider-Free
on:
  pull_request:
    paths:
      - 'hcl/**'
      - 'tests/test_unified*.py'
      - 'tests/test_quantified_logic.py'
      - 'tests/test_argument_readings.py'
      - 'scripts/witness_unified_s1.py'
      - 'scripts/witness_unified_s12.py'
      - 'scripts/witness_unified_s13.py'
      - 'scripts/witness_unified_s21.py'
      - 'scripts/witness_unified_s22.py'
      - 'scripts/witness_unified_s23.py'
      - 'scripts/witness_unified_s3.py'
      - 'scripts/witness_unified_s4.py'
      - 'scripts/witness_unified_discovery.py'
      - 'scripts/witness_unified_interaction.py'
      - 'scripts/witness_unified_affect.py'
      - 'scripts/witness_unified_relationship.py'
      - 'scripts/witness_unified_relationship_qualification.py'
      - 'scripts/witness_unified_retrieval.py'
      - 'scripts/witness_unified_memory_governance.py'
      - 'scripts/witness_unified_concepts.py'
      - 'scripts/witness_unified_narrative.py'
      - 'scripts/witness_unified_judgment.py'
      - 'scripts/witness_unified_concept_judgment.py'
      - 'scripts/witness_unified_persistent_concepts.py'
      - 'scripts/witness_unified_concept_repairs.py'
      - 'scripts/witness_unified_joint_changes.py'
      - 'scripts/witness_unified_weight_regions.py'
      - 'scripts/witness_unified_bounded_policies.py'
      - 'scripts/witness_unified_policy_weight_regions.py'
      - 'scripts/witness_unified_weight_region_delivery.py'
      - 'scripts/witness_unified_cross_packet_characters.py'
      - 'scripts/retry_public_download.py'
      - 'scripts/render_hcl_status.py'
      - 'docs/hcl_design_manifest.json'
      - 'requirements-conceptual.txt'
      - '.github/workflows/hcl-unified-provider-free.yml'
  push:
    branches: [main]
    paths:
      - 'hcl/**'
      - 'tests/test_unified*.py'
      - 'scripts/witness_unified_s1.py'
      - 'scripts/witness_unified_s12.py'
      - 'scripts/witness_unified_s13.py'
      - 'scripts/witness_unified_s21.py'
      - 'scripts/witness_unified_s22.py'
      - 'scripts/witness_unified_s23.py'
      - 'scripts/witness_unified_s3.py'
      - 'scripts/witness_unified_s4.py'
      - 'scripts/witness_unified_discovery.py'
      - 'scripts/witness_unified_interaction.py'
      - 'scripts/witness_unified_affect.py'
      - 'scripts/witness_unified_relationship.py'
      - 'scripts/witness_unified_relationship_qualification.py'
      - 'scripts/witness_unified_retrieval.py'
      - 'scripts/witness_unified_memory_governance.py'
      - 'scripts/witness_unified_concepts.py'
      - 'scripts/witness_unified_narrative.py'
      - 'scripts/witness_unified_judgment.py'
      - 'scripts/witness_unified_concept_judgment.py'
      - 'scripts/witness_unified_persistent_concepts.py'
      - 'scripts/witness_unified_concept_repairs.py'
      - 'scripts/witness_unified_joint_changes.py'
      - 'scripts/witness_unified_weight_regions.py'
      - 'scripts/witness_unified_bounded_policies.py'
      - 'scripts/witness_unified_policy_weight_regions.py'
      - 'scripts/witness_unified_weight_region_delivery.py'
      - 'scripts/witness_unified_cross_packet_characters.py'
      - 'scripts/retry_public_download.py'
      - 'scripts/render_hcl_status.py'
      - 'docs/hcl_design_manifest.json'
      - '.github/workflows/hcl-unified-provider-free.yml'
permissions:
  contents: read
jobs:
  unified-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # The full regression run takes ~59 minutes; retain time for every witness and artifact upload.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-conceptual.txt
      - name: Actual local logic and unified boundary contracts
        run: python -B -m unittest -v tests.test_unified_s1 tests.test_unified_s12 tests.test_unified_s13 tests.test_unified_s21 tests.test_unified_s22 tests.test_unified_s22_truth tests.test_unified_s22_temporal tests.test_unified_s22_scope tests.test_unified_s22_dependencies tests.test_unified_s22_upgrade tests.test_unified_s23 tests.test_unified_s23_context tests.test_unified_s23_recovery tests.test_unified_s23_revision tests.test_unified_s23_protocol tests.test_unified_s23_upgrade tests.test_unified_s3_epistemic tests.test_unified_s3_agency tests.test_unified_s3_causal tests.test_unified_s3_scene tests.test_unified_s3_upgrade tests.test_unified_s4_argumentation tests.test_unified_s4_engine tests.test_unified_s4_upgrade tests.test_unified_s3_abduction tests.test_unified_s3_discovery tests.test_unified_s3_discovery_upgrade tests.test_unified_discovery_limitations tests.test_unified_discovery_upgrade tests.test_unified_s3_interaction_math tests.test_unified_s3_interaction tests.test_unified_s3_interaction_upgrade tests.test_unified_s3_affect_math tests.test_unified_s3_affect tests.test_unified_s3_affect_upgrade tests.test_unified_s3_relationship_math tests.test_unified_s3_relationship_shared tests.test_unified_s3_relationship tests.test_unified_s3_relationship_qualification tests.test_unified_s3_relationship_upgrade tests.test_unified_result_identity tests.test_unified_s4_retrieval_index tests.test_unified_s4_retrieval tests.test_unified_s4_retrieval_engine tests.test_unified_s4_retrieval_work tests.test_unified_s4_retrieval_upgrade tests.test_unified_relationship_qualification_upgrade tests.test_unified_memory_lineage tests.test_unified_retention_inventory tests.test_unified_erasure_plan tests.test_unified_retention_objects tests.test_unified_erasure_fence tests.test_unified_erasure_cleanup tests.test_unified_governance_upgrade tests.test_unified_memory_delivery tests.test_unified_legacy_capsules tests.test_unified_legacy_capsule_store tests.test_unified_public_download_retry tests.test_unified_plan tests.test_quantified_logic tests.test_argument_readings tests.test_unified_s4_narrative_form tests.test_unified_s4_reading_fragments tests.test_unified_s4_reading_coordinator tests.test_unified_s4_literature tests.test_unified_s4_narrative_hypotheses tests.test_unified_s4_narrative_upgrade tests.test_unified_erasure_prefix tests.test_unified_s4_structure_mapping tests.test_unified_s4_concepts tests.test_unified_s4_narrative_analogies tests.test_unified_s4_concept_induction tests.test_unified_s4_concept_versions tests.test_unified_s4_narrative_variants tests.test_unified_s4_judgment_math tests.test_unified_s4_judgment tests.test_unified_s4_judgment_upgrade tests.test_unified_s4_concept_classification tests.test_unified_s4_concept_judgment tests.test_unified_s4_concept_judgment_upgrade tests.test_unified_persistent_concept_solver tests.test_unified_persistent_concept_propagation tests.test_unified_persistent_concept_upgrade tests.test_unified_concept_repair_oracle tests.test_unified_concept_repairs tests.test_unified_concept_repair_upgrade tests.test_unified_joint_change_oracle tests.test_unified_joint_changes tests.test_unified_joint_change_upgrade tests.test_unified_weight_region_math tests.test_unified_minimax_regret tests.test_unified_minimax_regret_upgrade tests.test_unified_weight_regions tests.test_unified_weight_region_upgrade tests.test_unified_migration_decode_cache tests.test_unified_bounded_policies tests.test_unified_bounded_policy_upgrade tests.test_unified_policy_weight_regions tests.test_unified_policy_weight_upgrade tests.test_unified_weight_region_delivery tests.test_unified_weight_delivery_upgrade tests.test_unified_narrative_characters tests.test_unified_narrative_character_upgrade tests.test_unified_cross_packet_characters tests.test_unified_cross_packet_character_upgrade
      - name: Check generated current status and compile only runtime code
        run: |
          python -m scripts.render_hcl_status --check
          python -m compileall -q hcl/kernel hcl/memory hcl/models hcl/operators hcl/runtime hcl/compat hcl/semantics hcl/api.py
          git diff --exit-code
      - name: Bind result-consumption witness to exact checked-out head
        run: |
          python -m scripts.witness_unified_s1 --output hcl-unified-s1-witness.json
          python -m scripts.witness_unified_s12 --output hcl-unified-s12-witness.json
          python -m scripts.witness_unified_s13 --output hcl-unified-s13-witness.json
          python -m scripts.witness_unified_s21 --output hcl-unified-s21-witness.json
          python -m scripts.witness_unified_s22 --output hcl-unified-s22-witness.json
          python -m scripts.witness_unified_s23 --output hcl-unified-s23-witness.json
          python -m scripts.witness_unified_s3 --output hcl-unified-s3-witness.json
          python -m scripts.witness_unified_s4 --output hcl-unified-s4-witness.json
          python -m scripts.witness_unified_discovery --output hcl-unified-discovery-witness.json
          python -m scripts.witness_unified_interaction --output hcl-unified-interaction-witness.json
          python -m scripts.witness_unified_affect --output hcl-unified-affect-witness.json
          python -m scripts.witness_unified_relationship --output hcl-unified-relationship-witness.json
          python -m scripts.witness_unified_relationship_qualification --output hcl-unified-relationship-qualification-witness.json
          python -m scripts.witness_unified_retrieval --output hcl-unified-retrieval-witness.json
          python -m scripts.witness_unified_memory_governance --output hcl-unified-memory-governance-witness.json
          python -m scripts.witness_unified_concepts --output hcl-unified-concepts-witness.json
          python -m scripts.witness_unified_narrative --output hcl-unified-narrative-witness.json
          python -m scripts.witness_unified_judgment --output hcl-unified-judgment-witness.json
          python -m scripts.witness_unified_concept_judgment --output hcl-unified-concept-judgment-witness.json
          python -m scripts.witness_unified_persistent_concepts --output hcl-unified-persistent-concepts-witness.json
          python -m scripts.witness_unified_concept_repairs --output hcl-unified-concept-repairs-witness.json
          python -m scripts.witness_unified_joint_changes --output hcl-unified-joint-changes-witness.json
          python -m scripts.witness_unified_weight_regions --output hcl-unified-weight-regions-witness.json
          python -m scripts.witness_unified_bounded_policies --output hcl-unified-bounded-policies-witness.json
          python -m scripts.witness_unified_policy_weight_regions --output hcl-unified-policy-weight-regions-witness.json
          python -m scripts.witness_unified_weight_region_delivery --output hcl-unified-weight-region-delivery-witness.json
          python -m scripts.witness_unified_narrative_characters --output hcl-unified-narrative-character-witness.json
          python -m scripts.witness_unified_cross_packet_characters --output hcl-unified-cross-packet-character-witness.json
      - uses: actions/upload-artifact@v4
        with:
          name: hcl-unified-s1-witness
          path: |
            hcl-unified-s1-witness.json
            hcl-unified-s12-witness.json
            hcl-unified-s13-witness.json
            hcl-unified-s21-witness.json
            hcl-unified-s22-witness.json
            hcl-unified-s23-witness.json
            hcl-unified-s3-witness.json
            hcl-unified-s4-witness.json
            hcl-unified-discovery-witness.json
            hcl-unified-interaction-witness.json
            hcl-unified-affect-witness.json
            hcl-unified-relationship-witness.json
            hcl-unified-relationship-qualification-witness.json
            hcl-unified-retrieval-witness.json
            hcl-unified-memory-governance-witness.json
            hcl-unified-concepts-witness.json
            hcl-unified-narrative-witness.json
            hcl-unified-judgment-witness.json
            hcl-unified-concept-judgment-witness.json
            hcl-unified-persistent-concepts-witness.json
            hcl-unified-concept-repairs-witness.json
            hcl-unified-joint-changes-witness.json
            hcl-unified-weight-regions-witness.json
            hcl-unified-bounded-policies-witness.json
            hcl-unified-policy-weight-regions-witness.json
            hcl-unified-weight-region-delivery-witness.json
            hcl-unified-narrative-character-witness.json
            hcl-unified-cross-packet-character-witness.json
