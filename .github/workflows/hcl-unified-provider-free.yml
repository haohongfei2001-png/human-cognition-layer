name: HCL Unified Runtime Provider-Free
on:
  pull_request:
    paths:
      - 'hcl/**'
      - 'tests/test_unified*.py'
      - 'tests/test_quantified_logic.py'
      - 'tests/test_argument_readings.py'
      - 'scripts/witness_unified_s1.py'
      - 'scripts/witness_unified_s12.py'
      - 'scripts/witness_unified_s13.py'
      - 'scripts/witness_unified_s21.py'
      - 'scripts/witness_unified_s22.py'
      - 'scripts/witness_unified_s23.py'
      - 'scripts/witness_unified_s3.py'
      - 'scripts/witness_unified_s4.py'
      - 'scripts/render_hcl_status.py'
      - 'docs/hcl_design_manifest.json'
      - 'requirements-conceptual.txt'
      - '.github/workflows/hcl-unified-provider-free.yml'
  push:
    branches: [main]
    paths:
      - 'hcl/**'
      - 'tests/test_unified*.py'
      - 'scripts/witness_unified_s1.py'
      - 'scripts/witness_unified_s12.py'
      - 'scripts/witness_unified_s13.py'
      - 'scripts/witness_unified_s21.py'
      - 'scripts/witness_unified_s22.py'
      - 'scripts/witness_unified_s23.py'
      - 'scripts/witness_unified_s3.py'
      - 'scripts/witness_unified_s4.py'
      - 'scripts/render_hcl_status.py'
      - 'docs/hcl_design_manifest.json'
      - '.github/workflows/hcl-unified-provider-free.yml'
permissions:
  contents: read
jobs:
  unified-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-conceptual.txt
      - name: Actual local logic and unified boundary contracts
        run: python -B -m unittest -v tests.test_unified_s1 tests.test_unified_s12 tests.test_unified_s13 tests.test_unified_s21 tests.test_unified_s22 tests.test_unified_s22_truth tests.test_unified_s22_temporal tests.test_unified_s22_scope tests.test_unified_s22_dependencies tests.test_unified_s22_upgrade tests.test_unified_s23 tests.test_unified_s23_context tests.test_unified_s23_recovery tests.test_unified_s23_revision tests.test_unified_s23_protocol tests.test_unified_s23_upgrade tests.test_unified_s3_epistemic tests.test_unified_s3_agency tests.test_unified_s3_causal tests.test_unified_s3_scene tests.test_unified_s3_upgrade tests.test_unified_s4_argumentation tests.test_unified_s4_engine tests.test_unified_s4_upgrade tests.test_unified_plan tests.test_quantified_logic tests.test_argument_readings
      - name: Check generated current status and compile only runtime code
        run: |
          python -m scripts.render_hcl_status --check
          python -m compileall -q hcl/kernel hcl/memory hcl/models hcl/operators hcl/runtime hcl/compat hcl/semantics hcl/api.py
          git diff --exit-code
      - name: Bind result-consumption witness to exact checked-out head
        run: |
          python -m scripts.witness_unified_s1 --output hcl-unified-s1-witness.json
          python -m scripts.witness_unified_s12 --output hcl-unified-s12-witness.json
          python -m scripts.witness_unified_s13 --output hcl-unified-s13-witness.json
          python -m scripts.witness_unified_s21 --output hcl-unified-s21-witness.json
          python -m scripts.witness_unified_s22 --output hcl-unified-s22-witness.json
          python -m scripts.witness_unified_s23 --output hcl-unified-s23-witness.json
          python -m scripts.witness_unified_s3 --output hcl-unified-s3-witness.json
          python -m scripts.witness_unified_s4 --output hcl-unified-s4-witness.json
      - uses: actions/upload-artifact@v4
        with:
          name: hcl-unified-s1-witness
          path: |
            hcl-unified-s1-witness.json
            hcl-unified-s12-witness.json
            hcl-unified-s13-witness.json
            hcl-unified-s21-witness.json
            hcl-unified-s22-witness.json
            hcl-unified-s23-witness.json
            hcl-unified-s3-witness.json
            hcl-unified-s4-witness.json
