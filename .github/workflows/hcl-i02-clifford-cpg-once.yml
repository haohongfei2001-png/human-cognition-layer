name: HCL I02 One-Time Clifford Complete Essay Strong CPG Development Calibration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unique first main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hcl-i02-clifford-cpg-once.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/clifford-runs.json
          python - <<'PY'
          import json,os
          runs=json.load(open('/tmp/clifford-runs.json'))['workflow_runs']
          assert len(runs)==1 and str(runs[0]['id'])==os.environ['GITHUB_RUN_ID']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==2.14.0'
      - name: Verify pinned public edition before any paid transport
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.i02_clifford_source import download_material
          raw,rdf=download_material()
          Path('/tmp/clifford.txt').write_bytes(raw)
          Path('/tmp/clifford.rdf').write_bytes(rdf)
          PY
          python -m scripts.run_i02_clifford_cpg_once --preflight --raw /tmp/clifford.txt --rdf /tmp/clifford.rdf --output i02-clifford-cpg-preflight.json
      - name: One complete-source semantic development calibration; no H or retries
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HCL_I02_CLIFFORD_AUTHORIZED: ONE_DEVELOPMENT_CALIBRATION_ONLY
        run: python -m scripts.run_i02_clifford_cpg_once --execute --raw /tmp/clifford.txt --rdf /tmp/clifford.rdf --output i02-clifford-cpg-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-i02-clifford-cpg-${{ github.run_id }}
          path: |
            i02-clifford-cpg-preflight.json
            i02-clifford-cpg-receipt.json
            reports/HCL_I02_CLIFFORD_CPG_PACKAGE.json
            reports/HCL_I02_CLIFFORD_SOURCE_FIRST_OBLIGATIONS.json
