name: HCL v0.5 Semantic Extraction v0.1 Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/HCL_V05_SEMANTIC_EXTRACTION_V01_TRIGGER"

permissions:
  contents: read

concurrency:
  group: hcl-v05-semantic-extraction-v01-once
  cancel-in-progress: false

env:
  CANDIDATE_ANCHOR: c1170ae9d95cf2bdfcb057cbe7d2633e687c862d
  FIXTURE_SHA256: afb653516b10a420eac0eb9cdcc6b740dc04728dc18cd4e07c5b693be8dfbd7a
  GOLD_SHA256: e2d638003b3cf2b0fdd8f742f9594777ec68caa89ec6dc024e86bf02c3d69964
  DEEPSEEK_BASE_URL: https://api.deepseek.com
  TRIGGER_PATH: .github/HCL_V05_SEMANTIC_EXTRACTION_V01_TRIGGER
  RUN_ONCE_TOKEN: HCL_V05_SEMANTIC_EXTRACTION_V01_RUN_ONCE_20260924_A1

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce immutable one-shot trigger
        shell: bash
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Refusing provider execution on workflow rerun attempt $GITHUB_RUN_ATTEMPT"
            exit 1
          fi
          test "$(cat "$TRIGGER_PATH")" = "$RUN_ONCE_TOKEN"
          if git log --format=%H "${{ github.event.before }}" -- "$TRIGGER_PATH" | grep -q .; then
            echo "Trigger path existed before this push; extraction rows are already consumed or trigger history is not fresh."
            exit 1
          fi
          git diff --diff-filter=A --name-only "${{ github.event.before }}" "$GITHUB_SHA" -- "$TRIGGER_PATH" \
            | grep -Fx "$TRIGGER_PATH"

      - name: Verify frozen candidate content
        shell: bash
        run: |
          git diff --exit-code "$CANDIDATE_ANCHOR"..HEAD -- \
            hcl/v05 \
            scripts/run_v05_semantic_extraction_v01.py \
            tests/test_v05_semantic_extraction_runner.py \
            eval/v05/semantic_extraction_v01_fixture.json \
            eval/v05/semantic_extraction_v01_gold.json \
            docs/HCL_V05_SEMANTIC_EXTRACTION_V01.md
          echo "$FIXTURE_SHA256  eval/v05/semantic_extraction_v01_fixture.json" | sha256sum -c -
          echo "$GOLD_SHA256  eval/v05/semantic_extraction_v01_gold.json" | sha256sum -c -

      - name: Run provider-free execution preflight
        run: |
          python scripts/run_v05_semantic_extraction_v01.py --validate-only
          python -m unittest -v tests.test_v05_semantic_extraction_runner

      - name: Install frozen provider client
        run: python -m pip install "openai==2.14.0"

      - name: Run frozen semantic extraction pilot once
        run: |
          python scripts/run_v05_semantic_extraction_v01.py \
            --model deepseek-flash \
            --fixtures eval/v05/semantic_extraction_v01_fixture.json \
            --gold eval/v05/semantic_extraction_v01_gold.json \
            --out artifacts/hcl-v05-semantic-extraction-v01/result.json

      - name: Verify complete evidence artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("artifacts/hcl-v05-semantic-extraction-v01/result.json")
          result = json.loads(p.read_text(encoding="utf-8"))

          assert result["format"] == "hcl-v05-semantic-extraction-v01"
          assert result["fixture_sha256"] == os.environ["FIXTURE_SHA256"]
          assert result["gold_sha256"] == os.environ["GOLD_SHA256"]
          assert result["total_events"] == 36
          assert len(result["rows"]) == 36
          assert result["backend"]["calls"] >= 36
          assert result["backend"]["input_chars"] > 0
          assert result["backend"]["output_chars"] > 0
          assert result["backend"]["provider_wall_seconds"] >= 0
          assert result["signal_tp"] + result["signal_fn"] == 36
          for row in result["rows"]:
              assert row["event_id"]
              assert "prediction" in row
              assert "expected" in row
              assert "risk_class" in row
              assert "exact" in row
          PY

      - name: Upload immutable extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcl-v05-semantic-extraction-v01-${{ github.run_id }}
          path: artifacts/hcl-v05-semantic-extraction-v01/
          if-no-files-found: warn
          retention-days: 90
