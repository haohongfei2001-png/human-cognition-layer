name: HCL Two-Call Planner Contract Smoke Provider-Free Gates
on:
  pull_request:
    paths: ['scripts/run_planner_contract_smoke.py', 'tests/test_planner_contract_smoke.py', 'reports/HCL_PLANNER_CONTRACT_SMOKE*', '.github/HCL_PLANNER_CONTRACT_SMOKE*', '.github/frozen/hcl-planner-contract-smoke*', '.github/workflows/hcl-planner-contract-smoke*', 'docs/HCL_PLANNER_CONTRACT_SMOKE.md']
  push:
    branches: [main]
    paths: ['scripts/run_planner_contract_smoke.py', 'tests/test_planner_contract_smoke.py', 'reports/HCL_PLANNER_CONTRACT_SMOKE*', '.github/HCL_PLANNER_CONTRACT_SMOKE*', '.github/frozen/hcl-planner-contract-smoke*', '.github/workflows/hcl-planner-contract-smoke*', 'docs/HCL_PLANNER_CONTRACT_SMOKE.md']
permissions:
  contents: read
jobs:
  provider-free-contract-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==50.0.0'
      - run: python -m unittest tests.test_planner_contract_smoke tests.test_v1_deepseek_metered tests.test_universal_encrypted_result
      - run: python -m scripts.development_planner_contracts_amendment
      - name: Frozen new package equals current executor and certified runtime
        run: |
          python - <<'PY'
          import json
          from scripts.run_planner_contract_smoke import PACKAGE, build_package
          assert json.loads(PACKAGE.read_text()) == build_package()
          print('FROZEN_NEW_DIAGNOSTIC_PACKAGE_PASS_NO_PROVIDER_CALL')
          PY
