name: HCL v1 Provider-Free Integration
on:
  pull_request:
    paths: ['hcl/**', 'tests/test_v1*', '.github/workflows/hcl-v1-provider-free.yml', 'docs/HCL_V1*', 'reports/HCL_V1*', 'README.md', 'STATUS.md']
  push:
    branches: [main]
    paths: ['hcl/**', 'tests/test_v1*', '.github/workflows/hcl-v1-provider-free.yml', 'docs/HCL_V1*', 'reports/HCL_V1*', 'README.md', 'STATUS.md']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provider-free registry tests
        run: python -m unittest discover -s tests -p 'test_v1_*.py' -v
