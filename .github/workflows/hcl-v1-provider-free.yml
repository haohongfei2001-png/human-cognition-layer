permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3' 'openai==2.14.0' 'z3-solver==4.15.4.0' 'cryptography==50.0.0'
      - name: Provider-free v1 integration tests
        run: python -m unittest discover -s tests -p 'test_v1*.py' -v 2>&1 | tee v1-integration.log
      - name: Offline source protocol and answer-boundary witness
        run: python -m unittest tests.test_development_mindgames_protocol tests.test_development_source_preparation tests.test_ordinary_answer_boundary_witness -v
      - name: Metered executor and private encrypted result gates
        run: python -m unittest tests.test_universal_development_execution tests.test_universal_encrypted_result tests.test_universal_launch_guard tests.test_planning_diagnostic -v
      - name: Frozen v0.4 through v0.10 provider-free regressions
        run: >-
          python -m unittest -v
          tests.test_v04_runtime tests.test_v04_perspective tests.test_v04_recovery
          tests.test_v04_store tests.test_v04_hypotheses tests.test_v04_probe_policy
          tests.test_v05_current_stance tests.test_v05_routed_semantic tests.test_v05_semantic_runtime tests.test_v05_store
          tests.test_v06_perspective_belief_runtime tests.test_v06_conversation_adapter tests.test_v06_perspective_belief_cq00
          tests.test_v07_intention_runtime tests.test_v07_semantic tests.test_v07_generic_narrative
          tests.test_v08_affect_runtime tests.test_v09_causal_runtime tests.test_v10_argumentation_runtime
          tests.test_quantified_logic tests.test_argument_readings
          2>&1 | tee v1-historical.log
      - name: Compile clean runtime boundary
        run: python -m compileall -q hcl/v1 hcl/cognition
      - name: Shared cognition positive witness
        run: |
          python scripts/witness_shared_cognition.py hcl-shared-cognition-witness.json
          python scripts/witness_semantic_entry.py hcl-semantic-entry-witness.json
          python scripts/witness_interpretation_revision.py hcl-interpretation-revision-witness.json
          python scripts/witness_retained_shared.py hcl-retained-shared-witness.json
          python scripts/witness_epistemic_objects.py hcl-epistemic-objects-witness.json
          python -m scripts.witness_i02_long_epistemic_v8 --output hcl-i02-long-epistemic-v8-witness.json
          python -m scripts.witness_i02_typographic_dialogue_v9 --output hcl-i02-typographic-dialogue-v9-witness.json
          python -m scripts.witness_i02_long_agency_v10 --output hcl-i02-long-agency-v10-witness.json
          python -m scripts.witness_i02_long_plan_composition_v11 --output hcl-i02-long-plan-composition-v11-witness.json
          python -m scripts.development_safe_failure_amendment
          python -m scripts.witness_embedded_scene_cues --output hcl-embedded-scene-cues-witness.json
          python -m scripts.witness_narrator_actual_scope --output hcl-narrator-actual-scope-witness.json
          python -m scripts.witness_qualified_speech_scope --output hcl-qualified-speech-scope-witness.json
          python -m scripts.witness_development_reader_entry_v13 --output hcl-development-reader-entry-v13-witness.json
          python -m scripts.witness_development_shared_reader_v14 --output hcl-development-shared-reader-v14-witness.json
          python -m scripts.witness_development_conditional_reader_v15 --output hcl-development-conditional-reader-v15-witness.json
          python -m scripts.witness_development_original_source_v16 --output hcl-development-original-source-v16-witness.json
          python -m scripts.witness_development_reader_cost_v17 --output hcl-development-reader-cost-v17-witness.json
          python -m scripts.witness_development_source_frame_v18 --output hcl-development-source-frame-v18-witness.json
          python -m scripts.witness_development_adaptive_reader_v19 --output hcl-development-adaptive-reader-v19-witness.json
          python -m scripts.witness_development_ordinary_access_v20 --output hcl-development-ordinary-access-v20-witness.json
          python -m scripts.witness_development_paragraph_access_v21 --output hcl-development-paragraph-access-v21-witness.json
          python -m scripts.witness_development_narrator_attribution_v22 --output hcl-development-narrator-attribution-v22-witness.json
          python -m scripts.witness_development_mixed_narration_v23 --output hcl-development-mixed-narration-v23-witness.json
          python -m scripts.witness_development_empty_state_v24 --output hcl-development-empty-state-v24-witness.json
          python -m scripts.witness_i02_narrator_epistemic_v12 --output hcl-i02-narrator-epistemic-v12-witness.json
          python scripts/witness_communication_views.py hcl-communication-views-witness.json
          python scripts/witness_revision_time.py hcl-revision-time-witness.json
          python scripts/witness_report_provenance.py hcl-report-provenance-witness.json
          python scripts/witness_integrated_scene.py hcl-integrated-scene-witness.json
          python scripts/witness_agency.py hcl-agency-witness.json
          python scripts/witness_action_explanations.py hcl-action-explanations-witness.json
          python scripts/witness_plan_feasibility.py hcl-plan-feasibility-witness.json
          python scripts/witness_appraisal.py hcl-appraisal-witness.json
          python scripts/witness_agency_chain.py hcl-agency-chain-witness.json
          python scripts/witness_commitment.py hcl-commitment-witness.json
          python scripts/witness_mutual_understanding.py hcl-mutual-understanding-witness.json
          python scripts/witness_strategic_communication.py hcl-strategic-communication-witness.json
          python scripts/witness_misunderstanding.py hcl-misunderstanding-witness.json
          python scripts/witness_joint_plan.py hcl-joint-plan-witness.json
          python scripts/witness_evidence_closure.py hcl-evidence-closure-witness.json
          python scripts/witness_character_development.py hcl-character-development-witness.json
          python scripts/witness_long_narrative.py hcl-long-narrative-witness.json
          python scripts/witness_normative_premises.py hcl-normative-premises-witness.json
          python scripts/witness_responsibility_composition.py hcl-responsibility-composition-witness.json
          python scripts/witness_concept_criteria.py hcl-concept-criteria-witness.json
          python scripts/witness_argument_analysis.py hcl-argument-analysis-witness.json
          python scripts/witness_argument_sensitivity.py hcl-argument-sensitivity-witness.json
          python scripts/witness_g_hc.py hcl-g-hc-witness.json
          python scripts/witness_query_planner.py hcl-query-planner-witness.json
          python scripts/witness_discriminating_evidence.py hcl-discriminating-evidence-witness.json
          python scripts/witness_execution_graph.py hcl-execution-graph-witness.json
          python scripts/witness_answer_audit.py hcl-answer-audit-witness.json
          python scripts/witness_hard_cognition.py hcl-hard-cognition-witness.json
          python scripts/witness_narrative_time.py hcl-narrative-time-witness.json
          python scripts/witness_episodic.py hcl-episodic-witness.json
          python scripts/witness_relationship_dynamics.py hcl-relationship-dynamics-witness.json
          python scripts/witness_contextual_values.py hcl-contextual-values-witness.json
          python scripts/witness_identity_roles.py hcl-identity-roles-witness.json
          python scripts/witness_relationship.py hcl-relationship-witness.json
          python scripts/witness_relational_conflict.py hcl-relational-conflict-witness.json
      - name: Record exact-SHA provider-free certification
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path('.')
          counts = {}
          for label, filename in [('v1', 'v1-integration.log'), ('historical', 'v1-historical.log')]:
              content = pathlib.Path(filename).read_text()
              match = re.search(r'Ran (\d+) tests', content)
              if not match or not re.search(r'^OK$', content, re.M):
                  raise SystemExit('missing successful test receipt')
              counts[label] = int(match.group(1))
          digest = hashlib.sha256()
          for path in sorted(root.glob('hcl/**/*.py')):
              digest.update(str(path).encode() + b'\0' + path.read_bytes())
          receipt = dict(schema='hcl-v1-provider-free-certification-v1', sha=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              workflow_event_sha=os.environ['GITHUB_SHA'],
              run_id=os.environ['GITHUB_RUN_ID'], event=os.environ['GITHUB_EVENT_NAME'],
              counts=counts, runtime_sha256=digest.hexdigest(), provider_calls=0,
              provider_spend_usd=0, scope='CORRECTNESS_NOT_EXTERNAL_UTILITY',
              longmemeval='SEALED_NOT_IN_TEST_SELECTION')
          pathlib.Path('hcl-v1-certification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: hcl-v1-provider-free-certification
          path: |
            hcl-v1-certification.json
            hcl-embedded-scene-cues-witness.json
            hcl-narrator-actual-scope-witness.json
            hcl-qualified-speech-scope-witness.json
