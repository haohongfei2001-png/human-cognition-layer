name: HCL v0.8 Affect Provider-Free Preflight
on:
  pull_request:
    paths:
      - "hcl/v08/**"
      - "scripts/*v08*"
      - "tests/test_v08*"
      - "eval/v08/**"
      - ".github/workflows/hcl-v08*.yml"
  push:
    branches: [main]
    paths:
      - "hcl/v08/**"
      - "scripts/*v08*"
      - "tests/test_v08*"
      - "eval/v08/**"
      - ".github/workflows/hcl-v08*.yml"
permissions:
  contents: read
jobs:
  provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0"
      - name: Verify pinned public development source
        run: |
          mkdir -p .cache
          curl --fail --location --retry 0 'https://huggingface.co/datasets/zhaoyuesun/CAREBecnch/resolve/8b4135219d493c4aaa2474beeefed11779c66890/first_person.json' -o .cache/carebench-first-person.json
          echo '93b410dab0ea3f40796f6e02bf4cb8085898670a340fe2a6f10f154593d6d05c  .cache/carebench-first-person.json' | sha256sum -c -
          python scripts/prepare_v08_carebench_dev_v01.py --source .cache/carebench-first-person.json
          python scripts/run_v08_carebench_dev_v01.py --source .cache/carebench-first-person.json --validate-only
      - name: Affect capability and previous runtime regressions
        run: |
          python -m unittest -v tests.test_v08_affect_runtime tests.test_v08_carebench_dev_v01 tests.test_v07_semantic tests.test_v07_intention_runtime tests.test_v06_perspective_belief_runtime tests.test_v05_current_stance tests.test_v05_routed_semantic tests.test_v05_semantic_runtime tests.test_v04_runtime tests.test_v04_perspective tests.test_v04_recovery
