name: HCL Bounded Diagnostic Package Provider-Free Gates
on:
  pull_request:
    paths: ['scripts/bounded_diagnostic*', 'scripts/run_bounded_diagnostics.py', 'tests/test_bounded_diagnostics.py', 'reports/HCL_BOUNDED_DIAGNOSTIC*', '.github/HCL_BOUNDED_DIAGNOSTIC*', '.github/frozen/hcl-bounded-diagnostics-once.yml', '.github/workflows/hcl-bounded-diagnostics*', 'docs/HCL_BOUNDED_DIAGNOSTICS.md']
  push:
    branches: [main]
    paths: ['scripts/bounded_diagnostic*', 'scripts/run_bounded_diagnostics.py', 'tests/test_bounded_diagnostics.py', 'reports/HCL_BOUNDED_DIAGNOSTIC*', '.github/HCL_BOUNDED_DIAGNOSTIC*', '.github/frozen/hcl-bounded-diagnostics-once.yml', '.github/workflows/hcl-bounded-diagnostics*', 'docs/HCL_BOUNDED_DIAGNOSTICS.md']
permissions:
  contents: read
jobs:
  provider-free-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==50.0.0'
      - run: python -m unittest tests.test_bounded_diagnostics tests.test_v1_deepseek_metered tests.test_universal_encrypted_result
      - run: python -m scripts.development_universal_sensitivity_amendment
      - name: Frozen new package equals current executor and certified runtime
        run: |
          python - <<'PY'
          import json
          from scripts.run_bounded_diagnostics import PACKAGE, build_package
          assert json.loads(PACKAGE.read_text()) == build_package()
          print('FROZEN_NEW_DIAGNOSTIC_PACKAGE_PASS_NO_PROVIDER_CALL')
          PY
