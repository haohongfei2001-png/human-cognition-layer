name: HCL Generic Answer-Loop Semantic Repair v0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/HCL_GENERIC_ANSWER_LOOP_SEMANTIC_REPAIR_V01_TRIGGER"

permissions:
  contents: read

env:
  STATE_REPAIR_V02_ANCHOR: 37df0afaacfa819abafe1979002100c645fab1c2
  ANSWER_REPAIR_IMPL_ANCHOR: 4ab45463bbeacbe3eb8eaa91be7ec908130ce980
  ANSWER_REPAIR_PROTOCOL_ANCHOR: 72252bdf7dba7c7f6a16dc961f8db29bbd7d01b6
  ORIGINAL_INTERFACE_AUDIT_PROTOCOL_ANCHOR: a1775b5ee6002165776b544aa65ae0fee4a0c9f3

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify successful state-repair path unchanged
        shell: bash
        run: |
          git diff --exit-code "$STATE_REPAIR_V02_ANCHOR"..HEAD --             hcl/v03/backends.py             hcl/v03/state_schema.json             hcl/v03/FROZEN_STATE_SEMANTICS.md
          python - <<'PY'
          import ast
          import os
          import subprocess
          from pathlib import Path

          anchor=os.environ["STATE_REPAIR_V02_ANCHOR"]
          old=subprocess.check_output(
              ["git","show",f"{anchor}:hcl/v03/answer_loop.py"],
              text=True,
          )
          new=Path("hcl/v03/answer_loop.py").read_text(encoding="utf-8")

          def tree(source):
              return ast.parse(source)

          def assigned(tree, name):
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      if any(isinstance(t, ast.Name) and t.id == name for t in node.targets):
                          return ast.dump(node.value, include_attributes=False)
              raise RuntimeError(name)

          def method(tree, cls_name, method_name):
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == cls_name:
                      for item in node.body:
                          if isinstance(item, ast.FunctionDef) and item.name == method_name:
                              return ast.dump(item, include_attributes=False)
              raise RuntimeError(method_name)

          ot, nt=tree(old), tree(new)
          assert assigned(ot,"STATE_SYSTEM") == assigned(nt,"STATE_SYSTEM")
          assert method(ot,"HCLAnswerLoop","build_state") == method(nt,"HCLAnswerLoop","build_state")
          assert method(ot,"HCLAnswerLoop","__init__") == method(nt,"HCLAnswerLoop","__init__")
          PY

      - name: Verify answer-loop repair implementation frozen
        shell: bash
        run: |
          git diff --exit-code "$ANSWER_REPAIR_IMPL_ANCHOR"..HEAD --             hcl/v03/answer_loop.py

      - name: Verify repair protocol and fresh suite frozen
        shell: bash
        run: |
          git diff --exit-code "$ANSWER_REPAIR_PROTOCOL_ANCHOR"..HEAD --             reports/HCL_GENERIC_ANSWER_LOOP_SEMANTIC_REPAIR_V01.md             eval/answer_loop/semantic_faithfulness_fresh_v01.json             scripts/run_generic_answer_loop_semantic_repair_v01.py             tests/test_generic_answer_loop_semantic_repair_v01.py             tests/test_generic_answer_loop_semantic_validation_v01.py

      - name: Verify original interface audit assets unchanged
        shell: bash
        run: |
          git diff --exit-code "$ORIGINAL_INTERFACE_AUDIT_PROTOCOL_ANCHOR"..HEAD --             scripts/run_info_state_output_interface_audit_v01.py             eval/answer_loop/info_state_output_interface_v01.json

      - name: Install zero-provider dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai==2.14.0"

      - name: Compile and run zero-provider gates
        shell: bash
        run: |
          python -m py_compile             hcl/v03/answer_loop.py             scripts/run_generic_answer_loop_semantic_repair_v01.py             tests/test_generic_answer_loop_semantic_repair_v01.py             tests/test_generic_answer_loop_semantic_validation_v01.py
          python -m unittest discover -s tests -p test_generic_answer_loop_semantic_repair_v01.py -v
          python -m unittest discover -s tests -p test_generic_answer_loop_semantic_validation_v01.py -v
          python -m unittest discover -s tests -p test_state_json_reliability_repair_v02.py -v
          python scripts/run_generic_answer_loop_semantic_repair_v01.py --help >/dev/null

  fresh_validation:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reverify frozen repair and fresh suite
        shell: bash
        run: |
          git diff --exit-code "$STATE_REPAIR_V02_ANCHOR"..HEAD --             hcl/v03/backends.py hcl/v03/state_schema.json hcl/v03/FROZEN_STATE_SEMANTICS.md
          git diff --exit-code "$ANSWER_REPAIR_IMPL_ANCHOR"..HEAD -- hcl/v03/answer_loop.py
          git diff --exit-code "$ANSWER_REPAIR_PROTOCOL_ANCHOR"..HEAD --             reports/HCL_GENERIC_ANSWER_LOOP_SEMANTIC_REPAIR_V01.md             eval/answer_loop/semantic_faithfulness_fresh_v01.json             scripts/run_generic_answer_loop_semantic_repair_v01.py

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai==2.14.0"

      - name: Run 12-case fresh semantic-faithfulness validation
        run: |
          python scripts/run_generic_answer_loop_semantic_repair_v01.py --workers 4

      - name: Enforce strict fresh-suite gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/hcl-generic-answer-loop-semantic-repair-v01")
          s=json.loads((root/"summary.json").read_text())
          assert s["fixture_count"] == 12
          assert s["completed_count"] == 12
          assert s["runtime_exception_count"] == 0
          assert s["semantic_correct_count"] == 12
          assert s["parser_valid_count"] == 12
          assert s["exact_format_count"] == s["exact_required_count"] == 12
          assert s["failed_ids"] == []
          assert s["pass_gate"] is True
          PY

      - name: Upload fresh validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-generic-answer-semantic-fresh-${{ github.run_id }}
          path: artifacts/hcl-generic-answer-loop-semantic-repair-v01/
          if-no-files-found: error
          retention-days: 30

  state_fidelity:
    needs: fresh_validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai==2.14.0"
      - name: Run production-path state-fidelity regression
        run: |
          python scripts/run_hcl_v03_state_fidelity_repair_v02.py             --model deepseek-flash             --fixtures eval/state_fidelity/fixtures_v01.json             --workers 4
      - name: Upload state-fidelity evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-generic-answer-semantic-state-${{ github.run_id }}
          path: artifacts/hcl-v03-state-fidelity-repair-v02/
          if-no-files-found: error
          retention-days: 30

  answer_checker:
    needs: fresh_validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai==2.14.0"
      - name: Run existing answer-checker fresh suite
        run: |
          python scripts/run_hcl_v03_answer_checker.py             --model deepseek-flash             --fixtures eval/answer_loop/checker_fixtures_v02_fresh.json             --workers 4
      - name: Upload checker evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-generic-answer-semantic-checker-${{ github.run_id }}
          path: artifacts/hcl-v03-answer-checker/
          if-no-files-found: error
          retention-days: 30

  output_interface:
    needs: fresh_validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai==2.14.0"
      - name: Run unchanged original 16-case output-interface audit
        run: |
          python scripts/run_info_state_output_interface_audit_v01.py             --out artifacts/hcl-generic-answer-semantic-interface-v01
      - name: Enforce original interface gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("artifacts/hcl-generic-answer-semantic-interface-v01/summary.json").read_text())
          assert s["fixture_count"] == 16
          assert s["full_loop"]["n"] == 8
          assert s["full_loop"]["semantic_correct"] == 8
          assert s["full_loop"]["parser_valid"] == 8
          assert s["forced_revision"]["n"] == 8
          assert s["forced_revision"]["semantic_correct"] == 8
          assert s["forced_revision"]["parser_valid"] == 8
          assert s["abstract_interface_defect_established"] is False
          PY
      - name: Upload interface evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-generic-answer-semantic-interface-${{ github.run_id }}
          path: artifacts/hcl-generic-answer-semantic-interface-v01/
          if-no-files-found: error
          retention-days: 30

  closure_gate:
    needs: [fresh_validation, state_fidelity, answer_checker, output_interface]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hcl-generic-answer-semantic-fresh-${{ github.run_id }}
          path: evidence/fresh
      - uses: actions/download-artifact@v4
        with:
          name: hcl-generic-answer-semantic-state-${{ github.run_id }}
          path: evidence/state
      - uses: actions/download-artifact@v4
        with:
          name: hcl-generic-answer-semantic-checker-${{ github.run_id }}
          path: evidence/checker
      - uses: actions/download-artifact@v4
        with:
          name: hcl-generic-answer-semantic-interface-${{ github.run_id }}
          path: evidence/interface
      - name: Enforce complete synthetic repair closure gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fresh=json.loads(Path("evidence/fresh/summary.json").read_text())
          state=json.loads(Path("evidence/state/summary.json").read_text())
          checker=json.loads(Path("evidence/checker/summary.json").read_text())
          interface=json.loads(Path("evidence/interface/summary.json").read_text())

          assert fresh["pass_gate"] is True
          assert state["failed"] == 0
          assert state["pass_rate"] == 1.0
          assert state["schema_valid_rate"] == 1.0
          assert checker["failed"] == 0
          assert checker["passed"] == checker["fixture_count"]
          assert interface["full_loop"]["semantic_correct"] == 8
          assert interface["full_loop"]["parser_valid"] == 8
          assert interface["forced_revision"]["semantic_correct"] == 8
          assert interface["forced_revision"]["parser_valid"] == 8
          assert interface["abstract_interface_defect_established"] is False
          PY
