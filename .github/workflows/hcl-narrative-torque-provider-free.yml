name: HCL Narrative Event Order Provider-Free Source and Utility Preflight
on:
  pull_request:
    paths: ["hcl/narrative_order.py", "scripts/*narrative_torque*", "tests/test_narrative*", "eval/narrative/**", "docs/HCL_NARRATIVE*", "reports/HCL_NARRATIVE*", ".github/workflows/hcl-narrative*.yml"]
  push:
    branches: [main]
    paths: ["hcl/narrative_order.py", "scripts/*narrative_torque*", "tests/test_narrative*", "eval/narrative/**", "docs/HCL_NARRATIVE*", "reports/HCL_NARRATIVE*", ".github/workflows/hcl-narrative*.yml"]
permissions:
  contents: read
jobs:
  provider-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pandas>=2.2,<3" "openai==2.14.0"
      - name: Verify pinned public dev source without case/gold display
        run: |
          mkdir -p .cache/torque
          curl --fail --location --retry 0 'https://raw.githubusercontent.com/qiangning/TORQUE-dataset/ab27019cc6a317fde3c879900499f02acce8b16d/data/dev.json' -o .cache/torque/dev.json
          echo '7a8dd84c984f28a5284bdfda57b447218e1269cd2eaf05b5e173394fc1522434  .cache/torque/dev.json' | sha256sum -c -
          python scripts/run_narrative_torque_dev_v01.py --source-file .cache/torque/dev.json --validate-only
          python -m unittest -v tests.test_narrative_order tests.test_narrative_torque_dev_v01
