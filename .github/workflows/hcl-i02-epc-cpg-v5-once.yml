name: HCL I02 One-Time EPC CPG v5 Development Calibration
on:
  push:
    branches: [main]
    paths: ['.github/HCL_I02_EPC_CPG_V5_TRIGGER']
permissions:
  contents: read
  actions: read
concurrency:
  group: hcl-i02-epc-cpg-v5-once
  cancel-in-progress: false
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject repeated workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/HCL_I02_EPC_CPG_V5_TRIGGER
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hcl-i02-epc-cpg-v5-once.yml/runs?event=push&per_page=100" > /tmp/hcl-i02-epc-cpg-v5-runs.json
          python - <<'PY'
          import json, os
          runs = json.load(open('/tmp/hcl-i02-epc-cpg-v5-runs.json'))['workflow_runs']
          assert len(runs) == 1 and str(runs[0]['id']) == os.environ['GITHUB_RUN_ID']
          PY
      - name: Install pinned existing clients
        run: python -m pip install openai==2.14.0 beautifulsoup4==4.13.4
      - name: Provider-free source, runtime, fairness and cost preflight
        run: python scripts/run_i02_epc_cpg_v5_once.py --preflight --output i02-epc-cpg-v5-preflight.json
      - name: One bounded CPG development calibration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HCL_I02_EPC_CPG_V5_AUTHORIZED: ONE_CALIBRATION_ONLY
        run: python scripts/run_i02_epc_cpg_v5_once.py --execute --output i02-epc-cpg-v5-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcl-i02-epc-cpg-v5-${{ github.run_id }}
          path: |
            i02-epc-cpg-v5-preflight.json
            i02-epc-cpg-v5-receipt.json
            reports/HCL_I02_EPC_CPG_V5_PACKAGE.json
          if-no-files-found: error
