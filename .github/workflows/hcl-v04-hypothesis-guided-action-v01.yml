name: HCL v0.4 Hypothesis-Guided Action Capability v0.1

on:
  push:
    branches:
      - main
      - manager/hcl-v04-action-capability-takeover-20260923
    paths:
      - ".github/HCL_V04_GUIDED_ACTION_V01_TRIGGER"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install openai
      - name: Verify frozen fixtures and local contract
        run: |
          echo '2605318bc10cae6710b9597ba82870058a71abcf46315aeeae5a36527d412f3a  eval/v04/hypothesis_guided_action_v01.json' | sha256sum -c -
          python scripts/run_v04_hypothesis_guided_action_v01.py --validate-only
          python -m unittest tests.test_v04_guided_action_runner tests.test_v04_hypotheses tests.test_v04_probe_policy
      - name: Run frozen C/D/E action comparison
        run: |
          python scripts/run_v04_hypothesis_guided_action_v01.py \
            --model deepseek-flash \
            --fixtures eval/v04/hypothesis_guided_action_v01.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcl-v04-guided-action-v01-${{ github.run_id }}
          path: artifacts/hcl-v04-guided-action-v01/
          if-no-files-found: warn
          retention-days: 30
