name: HCL v0.4 Minimal Slice

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hcl/v04/**"
      - "tests/test_v04_*.py"
      - "eval/v04/long_horizon_bounded_context_v01_*.json"
      - "scripts/run_v04_long_horizon_bounded_context_v01.py"
      - "docs/HCL_V04_*.md"
      - ".github/workflows/hcl-v04-minimal-slice.yml"
  push:
    branches:
      - main
    paths:
      - "hcl/v04/**"
      - "tests/test_v04_*.py"
      - "eval/v04/long_horizon_bounded_context_v01_*.json"
      - "scripts/run_v04_long_horizon_bounded_context_v01.py"
      - "docs/HCL_V04_*.md"
      - ".github/workflows/hcl-v04-minimal-slice.yml"

permissions:
  contents: read

jobs:
  minimal-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile v0.4
        run: python -m compileall -q hcl/v04 tests/test_v04_*.py
      - name: Run v0.4 contract tests
        run: |
          python -m unittest -v \
            tests.test_v04_store \
            tests.test_v04_perspective \
            tests.test_v04_recovery \
            tests.test_v04_runtime
      - name: Run long-horizon provider-free preflight when present
        if: ${{ hashFiles('scripts/run_v04_long_horizon_bounded_context_v01.py') != '' }}
        run: |
          python scripts/run_v04_long_horizon_bounded_context_v01.py --validate-only
          python -m unittest -v tests.test_v04_long_horizon_runner
